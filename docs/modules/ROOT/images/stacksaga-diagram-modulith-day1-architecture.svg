<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #4a5568; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #2d3748; }
      .module-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1a365d; }
      .card-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #2d3748; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4a5568; }
      .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #2b6cb0; font-weight: 600; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-accent { stroke: #28b86c; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
      .arrow-dashed { stroke: #3182ce; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#28b86c" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3182ce" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <text x="530" y="30" text-anchor="middle" class="title">StackSaga Modulith Architecture: Day 1 Topology</text>
  <text x="530" y="52" text-anchor="middle" class="subtitle">Single Spring Boot application deployable artifact running at in-process memory speed with 0 external infrastructure servers.</text>

  <!-- CLIENT CALLS INBOUND -->
  <g transform="translate(40, 75)">
    <rect width="120" height="42" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.2"/>
    <text x="60" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle" dominant-baseline="central">Client Inbound</text>
    <text x="60" y="34" font-family="monospace" font-size="9" fill="#718096" text-anchor="middle">(POST /orders)</text>
  </g>
  <path d="M 160 96 L 210 96" class="arrow"/>

  <!-- MAIN SPRING BOOT CONTAINER -->
  <g transform="translate(210, 75)">
    <!-- Container Body -->
    <rect width="810" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Container Top Header -->
    <rect width="810" height="38" rx="12" fill="#2d3748"/>
    <rect y="26" width="810" height="12" fill="#2d3748"/>
    <circle cx="20" cy="19" r="6" fill="#e53e3e"/>
    <circle cx="36" cy="19" r="6" fill="#ecc94b"/>
    <circle cx="52" cy="19" r="6" fill="#48bb78"/>
    <text x="75" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" dominant-baseline="central">
      SPRING BOOT APPLICATION (MODULAR MONOLITH ARTIFACT) • stacksaga-spring-boot-starter
    </text>

    <!-- BADGE: IN PROCESS SPEED -->
    <rect x="620" y="7" width="175" height="24" rx="12" fill="#28b86c"/>
    <text x="707" y="19" class="pill-text">⚡ &lt;1ms In-Process Speed</text>

    <!-- MODULE 1: ORDER MODULE (ORCHESTRATOR) -->
    <g transform="translate(25, 55)">
      <rect width="255" height="285" rx="8" fill="#ffffff" stroke="#bee3f8" stroke-width="1.5"/>
      <rect width="255" height="30" rx="8" fill="#ebf8ff"/>
      <rect y="20" width="255" height="10" fill="#ebf8ff"/>
      <text x="127" y="16" class="module-title" text-anchor="middle">Order Domain (Saga Orchestrator)</text>

      <!-- Sub-Box: OrderController -->
      <g transform="translate(15, 38)">
        <rect width="225" height="42" rx="5" fill="#f7fafc" stroke="#e2e8f0"/>
        <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2b6cb0">OrderController</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#718096">Initializes OrderDomainEntity</text>
      </g>

      <!-- Sub-Box: CreateOrderExecutor -->
      <g transform="translate(15, 88)">
        <rect width="225" height="42" rx="5" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="12" y="18" class="code-text" fill="#22543d">CreateOrderExecutor</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#48bb78">Initial state milestone (PENDING)</text>
      </g>
      <path d="M 127 130 L 127 142" class="arrow-accent"/>

      <!-- Sub-Box: MakePaymentExecutor -->
      <g transform="translate(15, 144)">
        <rect width="225" height="42" rx="5" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="12" y="18" class="code-text" fill="#22543d">MakePaymentExecutor</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#4a5568">Calls PaymentInternalService</text>
      </g>
      <path d="M 127 186 L 127 198" class="arrow-accent"/>

      <!-- Sub-Box: ReserveInventoryExecutor -->
      <g transform="translate(15, 200)">
        <rect width="225" height="42" rx="5" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="12" y="18" class="code-text" fill="#22543d">ReserveInventoryExecutor</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#4a5568">Calls InventoryInternalService</text>
      </g>
      <path d="M 127 242 L 127 254" class="arrow-accent"/>

      <!-- Sub-Box: DispatchNotificationExecutor -->
      <g transform="translate(15, 256)">
        <rect width="225" height="22" rx="4" fill="#edf2f7" stroke="#cbd5e0"/>
        <text x="112" y="12" font-family="monospace" font-size="8.5" fill="#4a5568" text-anchor="middle" dominant-baseline="central">DispatchNotificationExecutor (Terminal)</text>
      </g>
    </g>

    <!-- IN-PROCESS ARROWS CROSSING TO OTHER MODULES -->
    <path d="M 280 220 C 350 220, 360 120, 430 120" class="arrow-dashed"/>
    <text x="350" y="160" font-family="sans-serif" font-size="9" font-weight="bold" fill="#3182ce" text-anchor="middle">Spring Bean</text>
    <text x="350" y="172" font-family="sans-serif" font-size="8.5" fill="#718096" text-anchor="middle">In-Memory (&lt;1ms)</text>

    <path d="M 280 275 C 350 275, 360 275, 430 275" class="arrow-dashed"/>
    <text x="350" y="265" font-family="sans-serif" font-size="9" font-weight="bold" fill="#3182ce" text-anchor="middle">Spring Bean</text>
    <text x="350" y="295" font-family="sans-serif" font-size="8.5" fill="#718096" text-anchor="middle">In-Memory (&lt;1ms)</text>

    <!-- MODULE 2: PAYMENT MODULE -->
    <g transform="translate(430, 55)">
      <rect width="355" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect width="355" height="28" rx="8" fill="#f7fafc"/>
      <rect y="18" width="355" height="10" fill="#f7fafc"/>
      <text x="16" y="18" class="module-title">Payment Domain Module (Bounded Context)</text>
      <rect x="250" y="5" width="95" height="18" rx="9" fill="#edf2f7"/>
      <text x="297" y="14" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#4a5568" text-anchor="middle" dominant-baseline="central">Zero StackSaga Dep</text>

      <g transform="translate(15, 36)">
        <rect width="325" height="42" rx="5" fill="#ebf8ff" stroke="#bee3f8"/>
        <text x="12" y="18" class="code-text">PaymentInternalService.charge(orderId, amount)</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#4a5568">Executes payment transaction inside local payment_schema</text>
      </g>

      <g transform="translate(15, 84)">
        <rect width="325" height="38" rx="5" fill="#fff5f5" stroke="#feb2b2"/>
        <text x="12" y="16" class="code-text" fill="#c53030">PaymentInternalService.refund(paymentRefId)</text>
        <text x="12" y="30" font-family="sans-serif" font-size="9" fill="#742a2a">Compensation endpoint invoked by doRevert() if downstream fails</text>
      </g>
    </g>

    <!-- MODULE 3: INVENTORY MODULE -->
    <g transform="translate(430, 205)">
      <rect width="355" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect width="355" height="28" rx="8" fill="#f7fafc"/>
      <rect y="18" width="355" height="10" fill="#f7fafc"/>
      <text x="16" y="18" class="module-title">Inventory Domain Module (Bounded Context)</text>
      <rect x="250" y="5" width="95" height="18" rx="9" fill="#edf2f7"/>
      <text x="297" y="14" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#4a5568" text-anchor="middle" dominant-baseline="central">Zero StackSaga Dep</text>

      <g transform="translate(15, 36)">
        <rect width="325" height="42" rx="5" fill="#ebf8ff" stroke="#bee3f8"/>
        <text x="12" y="18" class="code-text">InventoryInternalService.reserve(orderId, items)</text>
        <text x="12" y="32" font-family="sans-serif" font-size="9" fill="#4a5568">Decrements stock inside local inventory_schema</text>
      </g>

      <g transform="translate(15, 84)">
        <rect width="325" height="38" rx="5" fill="#fff5f5" stroke="#feb2b2"/>
        <text x="12" y="16" class="code-text" fill="#c53030">InventoryInternalService.release(orderId)</text>
        <text x="12" y="30" font-family="sans-serif" font-size="9" fill="#742a2a">Compensation endpoint releasing reserved stock upon rollback</text>
      </g>
    </g>

    <!-- BOTTOM BAR: EMBEDDED ENGINE HIGHLIGHT -->
    <g transform="translate(25, 355)">
      <rect width="760" height="50" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.2"/>
      <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22543d">
        Embedded Saga Execution Coordinator (SEC) Engine
      </text>
      <text x="15" y="38" font-family="sans-serif" font-size="9.5" fill="#276749">
        Runs natively inside application threads. Eliminates Temporal clusters, Camunda servers, and Kafka messaging broker requirements on Day 1.
      </text>
    </g>
  </g>

  <!-- DATABASE DOWNWARD CONNECTOR -->
  <path d="M 615 495 L 615 525" class="arrow-accent"/>

  <!-- DATABASE LAYER (SINGLE PHYSICAL DB, ISOLATED SCHEMAS) -->
  <g transform="translate(210, 525)">
    <rect width="810" height="135" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="810" height="30" rx="10" fill="#edf2f7"/>
    <rect y="20" width="810" height="10" fill="#edf2f7"/>
    <text x="18" y="16" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#2d3748">
      PRIMARY RELATIONAL DATABASE (PostgreSQL / MySQL) — SINGLE INSTANCE ON DAY 1
    </text>
    <rect x="640" y="6" width="155" height="18" rx="9" fill="#e2e8f0"/>
    <text x="717" y="15" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#4a5568" text-anchor="middle" dominant-baseline="central">Strict Schema Separation</text>

    <!-- DB Sub-Schema 1 -->
    <g transform="translate(20, 40)">
      <rect width="175" height="80" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
      <text x="87" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b6cb0" text-anchor="middle">order_schema</text>
      <text x="12" y="36" class="body-text">• orders table</text>
      <text x="12" y="52" class="body-text">• order_items table</text>
      <text x="12" y="70" font-family="sans-serif" font-size="9" font-weight="bold" fill="#28b86c">✓ No Cross-Module FK</text>
    </g>

    <!-- DB Sub-Schema 2 -->
    <g transform="translate(215, 40)">
      <rect width="175" height="80" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
      <text x="87" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b6cb0" text-anchor="middle">payment_schema</text>
      <text x="12" y="36" class="body-text">• payments table</text>
      <text x="12" y="52" class="body-text">• payment_audit table</text>
      <text x="12" y="70" font-family="sans-serif" font-size="9" font-weight="bold" fill="#28b86c">✓ No Cross-Module FK</text>
    </g>

    <!-- DB Sub-Schema 3 -->
    <g transform="translate(410, 40)">
      <rect width="175" height="80" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
      <text x="87" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b6cb0" text-anchor="middle">inventory_schema</text>
      <text x="12" y="36" class="body-text">• stock_items table</text>
      <text x="12" y="52" class="body-text">• stock_reservations</text>
      <text x="12" y="70" font-family="sans-serif" font-size="9" font-weight="bold" fill="#28b86c">✓ No Cross-Module FK</text>
    </g>

    <!-- DB Sub-Schema 4: Event Store -->
    <g transform="translate(605, 40)">
      <rect width="185" height="80" rx="6" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.5"/>
      <text x="92" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2c5282" text-anchor="middle">saga_event_store</text>
      <text x="12" y="36" font-family="sans-serif" font-size="9.5" fill="#2b6cb0">• saga_snapshots</text>
      <text x="12" y="52" font-family="sans-serif" font-size="9.5" fill="#2b6cb0">• transaction_event_log</text>
      <text x="12" y="70" font-family="sans-serif" font-size="9" font-weight="bold" fill="#28b86c">✓ Zero-Infra Event Store</text>
    </g>
  </g>
</svg>
