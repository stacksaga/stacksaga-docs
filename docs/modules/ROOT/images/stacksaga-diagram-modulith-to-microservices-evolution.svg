<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #4a5568; }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1a365d; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3748; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4a5568; line-height: 1.4; }
      .code-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #2b6cb0; font-weight: 600; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #28b86c; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
      .arrow-blue { stroke: #3182ce; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#28b86c" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3182ce" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Header -->
  <text x="530" y="30" text-anchor="middle" class="title">Zero-Rewrite Service Extraction: From Modulith to Microservices</text>
  <text x="530" y="52" text-anchor="middle" class="subtitle">Extracting high-throughput modules into standalone microservices without modifying saga graphs, compensations, or event logs.</text>

  <!-- TOP HALF: DAY 1 MODULAR MONOLITH -->
  <g transform="translate(40, 75)">
    <!-- Container -->
    <rect width="980" height="235" rx="10" fill="#f8fafc" stroke="#cbd5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="980" height="34" rx="10" fill="#ebf8ff" stroke="#bee3f8"/>
    <rect y="24" width="980" height="10" fill="#ebf8ff"/>
    <circle cx="20" cy="17" r="8" fill="#3182ce"/>
    <text x="20" y="17" class="pill-text">1</text>
    <text x="38" y="17" class="phase-title" dominant-baseline="central">DAY 1: IN-PROCESS MODULAR MONOLITH (SUB-MILLISECOND SPEED)</text>
    <rect x="790" y="6" width="170" height="22" rx="11" fill="#3182ce"/>
    <text x="875" y="17" class="pill-text">0 Network Hops • &lt;1ms Latency</text>

    <!-- Inside Monolith App -->
    <g transform="translate(20, 50)">
      <!-- Order Module Box -->
      <g transform="translate(0, 0)">
        <rect width="360" height="160" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
        <text x="15" y="22" class="card-title">Order Module (Embedded Orchestrator)</text>
        <rect x="15" y="34" width="330" height="110" rx="6" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="25" y="52" class="code-text" fill="#22543d">MakePaymentExecutor.java</text>
        <text x="25" y="70" font-family="monospace" font-size="9.5" fill="#4a5568">PaymentResult res = </text>
        <text x="145" y="70" font-family="monospace" font-size="9.5" fill="#2b6cb0" font-weight="bold">paymentInternalService.charge(</text>
        <text x="40" y="86" font-family="monospace" font-size="9.5" fill="#2b6cb0" font-weight="bold">order.getId(), order.getAmount());</text>
        <text x="25" y="104" font-family="sans-serif" font-size="9" fill="#276749">✓ Direct Spring Bean method call in memory</text>
        <text x="25" y="122" font-family="sans-serif" font-size="9" fill="#276749">✓ Commits state to monolith's embedded Event Store</text>
      </g>

      <!-- In-Memory Arrow -->
      <path d="M 360 85 L 430 85" class="arrow-green"/>
      <text x="395" y="75" font-family="sans-serif" font-size="9" font-weight="bold" fill="#28b86c" text-anchor="middle">In-Memory</text>

      <!-- Payment Module Box -->
      <g transform="translate(435, 0)">
        <rect width="250" height="160" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
        <text x="15" y="22" class="card-title">Payment Module (Local Domain)</text>
        <rect x="15" y="34" width="220" height="110" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
        <text x="25" y="52" class="code-text">PaymentInternalService.java</text>
        <text x="25" y="72" class="body-text">• Local Spring Bean</text>
        <text x="25" y="90" class="body-text">• Writes to payment_schema</text>
        <text x="25" y="108" class="body-text">• Zero StackSaga dependencies</text>
      </g>

      <!-- Database Info Box -->
      <g transform="translate(710, 0)">
        <rect width="230" height="160" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
        <text x="15" y="22" class="card-title">Single Monolith Database</text>
        <rect x="15" y="34" width="200" height="110" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
        <text x="25" y="52" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2d3748">• order_schema</text>
        <text x="25" y="70" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2d3748">• payment_schema</text>
        <text x="25" y="88" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#2b6cb0">• saga_event_store</text>
        <text x="25" y="112" font-family="sans-serif" font-size="8.5" fill="#28b86c" font-weight="bold">✓ 0 External Cluster Costs</text>
      </g>
    </g>
  </g>

  <!-- TRANSITION DIVIDER ARROW -->
  <g transform="translate(530, 318)">
    <circle cx="0" cy="0" r="14" fill="#28b86c"/>
    <text x="0" y="1" class="pill-text" font-size="12">▼</text>
    <text x="75" y="3" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#28b86c">SCALE TRIGGER: Extracting Payment Module into Standalone Microservice</text>
  </g>

  <!-- BOTTOM HALF: DAY N EXTRACTED SERVICE (ZERO REWRITE) -->
  <g transform="translate(40, 345)">
    <!-- Container -->
    <rect width="980" height="295" rx="10" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="980" height="34" rx="10" fill="#e6fffa" stroke="#81e6d9"/>
    <rect y="24" width="980" height="10" fill="#e6fffa"/>
    <circle cx="20" cy="17" r="8" fill="#28b86c"/>
    <text x="20" y="17" class="pill-text">2</text>
    <text x="38" y="17" class="phase-title" dominant-baseline="central" fill="#234e52">DAY N: DISTRIBUTED / HYBRID TOPOLOGY (ZERO REWRITE ON SAGA PIPELINE)</text>
    <rect x="770" y="6" width="190" height="22" rx="11" fill="#28b86c"/>
    <text x="865" y="17" class="pill-text">Zero Saga Rewrite • Instant Scale</text>

    <!-- Inside Extracted System -->
    <g transform="translate(20, 48)">
      <!-- Order Service Container -->
      <g transform="translate(0, 0)">
        <rect width="360" height="230" rx="8" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.2"/>
        <text x="15" y="20" class="card-title" fill="#22543d">Order Service (Core Monolith / Orchestrator)</text>
        
        <rect x="15" y="30" width="330" height="125" rx="6" fill="#f0fff4" stroke="#68d391"/>
        <text x="25" y="48" class="code-text" fill="#22543d">MakePaymentExecutor.java (Scale Phase)</text>
        <text x="25" y="66" font-family="monospace" font-size="9" fill="#4a5568">// ONLY THIS TRANSPORT CALL CHANGES:</text>
        <text x="25" y="82" font-family="monospace" font-size="9.5" fill="#4a5568">PaymentResult res = </text>
        <text x="145" y="82" font-family="monospace" font-size="9.5" fill="#c53030" font-weight="bold">paymentServiceClient.chargeRemote(</text>
        <text x="40" y="98" font-family="monospace" font-size="9.5" fill="#c53030" font-weight="bold">order.getId(), order.getAmount());</text>
        <text x="25" y="118" font-family="sans-serif" font-size="9" fill="#22543d" font-weight="bold">✓ Step manager transition unchanged:</text>
        <text x="25" y="132" class="code-text" fill="#276749">.toNextExecutor(ReserveInventoryExecutor.class)</text>
        <text x="25" y="146" font-family="sans-serif" font-size="9" fill="#22543d" font-weight="bold">✓ Compensation doRevert() unchanged!</text>

        <!-- What Stays Intact Pill List -->
        <g transform="translate(15, 162)">
          <rect width="330" height="58" rx="5" fill="#f7fafc" stroke="#e2e8f0"/>
          <text x="12" y="18" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2d3748">WHAT REMAINS 100% UNTOUCHED:</text>
          <text x="12" y="34" class="body-text">• OrderDomainEntity schema &amp; serializations</text>
          <text x="12" y="48" class="body-text">• Symmetrical compensation graph &amp; Event Store log</text>
        </g>
      </g>

      <!-- Network Call Arrow -->
      <path d="M 360 85 L 440 85" class="arrow-green" stroke-width="2"/>
      <text x="400" y="72" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#28b86c" text-anchor="middle">REST / gRPC</text>
      <text x="400" y="100" font-family="sans-serif" font-size="8" fill="#718096" text-anchor="middle">Network Hop</text>

      <!-- Extracted Standalone Payment Service -->
      <g transform="translate(445, 0)">
        <rect width="250" height="230" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
        <text x="15" y="20" class="card-title">Extracted Payment Microservice</text>
        <rect x="15" y="30" width="220" height="185" rx="6" fill="#ebf8ff" stroke="#bee3f8"/>
        <text x="25" y="50" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2b6cb0">Independent Container / Pod</text>
        <text x="25" y="70" class="body-text">• Dedicated deployment cycle</text>
        <text x="25" y="88" class="body-text">• Auto-scales independently</text>
        <text x="25" y="106" class="body-text">• Exposes REST / gRPC endpoint</text>
        <text x="25" y="124" class="body-text">• Dedicated payment database</text>
        <rect x="25" y="142" width="195" height="30" rx="4" fill="#2b6cb0"/>
        <text x="122" y="157" class="pill-text" font-size="9">Zero StackSaga SDK Required</text>
        <text x="122" y="167" class="pill-text" font-size="8">Standard Spring Boot REST API</text>
      </g>

      <!-- Comparison Matrix Box -->
      <g transform="translate(710, 0)">
        <rect width="230" height="230" rx="8" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.2"/>
        <text x="15" y="20" class="card-title" fill="#22543d">Extraction Comparison</text>
        
        <rect x="12" y="32" width="206" height="58" rx="5" fill="#fff5f5" stroke="#feb2b2"/>
        <text x="20" y="48" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#c53030">Without StackSaga:</text>
        <text x="20" y="64" class="body-text" fill="#742a2a">Rewrite transactions, introduce</text>
        <text x="20" y="78" class="body-text" fill="#742a2a">Outbox, Kafka, &amp; orchestrators.</text>

        <rect x="12" y="96" width="206" height="120" rx="5" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="20" y="114" font-family="sans-serif" font-size="10" font-weight="bold" fill="#22543d">With StackSaga:</text>
        <text x="20" y="132" class="body-text" font-weight="bold" fill="#276749">✓ Zero saga rewrite</text>
        <text x="20" y="148" class="body-text" font-weight="bold" fill="#276749">✓ Symmetrical compensation</text>
        <text x="20" y="164" class="body-text" font-weight="bold" fill="#276749">✓ Idempotent safety keys</text>
        <text x="20" y="180" class="body-text" font-weight="bold" fill="#276749">✓ Continuous event log</text>
        <text x="20" y="202" font-family="sans-serif" font-size="9" font-weight="bold" fill="#22543d">MIGRATION TIME: HOURS!</text>
      </g>
    </g>
  </g>
</svg>
