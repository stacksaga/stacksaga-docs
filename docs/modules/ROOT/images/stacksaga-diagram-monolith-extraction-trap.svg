<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #4a5568; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #2d3748; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #4a5568; line-height: 1.4; }
      .code-pill { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #2b6cb0; font-weight: 600; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #718096; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #e53e3e; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrow-red); }
      .arrow-green { stroke: #28b86c; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#718096" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e53e3e" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#28b86c" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <text x="520" y="32" text-anchor="middle" class="title">The Extraction Dilemma: Traditional Monolith vs. StackSaga Modulith</text>
  <text x="520" y="54" text-anchor="middle" class="subtitle">How traditional @Transactional creates a fatal rewrite trap, and how StackSaga Atomic Executors enable zero-rewrite microservice extraction.</text>

  <!-- LEFT PANEL: TRADITIONAL MONOLITH (THE TRAP) -->
  <g transform="translate(30, 75)">
    <!-- Panel Container -->
    <rect width="470" height="540" rx="10" fill="#fffaf0" stroke="#fed7d7" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Panel Header -->
    <rect width="470" height="42" rx="10" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
    <rect y="32" width="470" height="10" fill="#fff5f5"/>
    <circle cx="24" cy="21" r="10" fill="#e53e3e"/>
    <text x="24" y="21" class="badge-text">✕</text>
    <text x="245" y="21" class="header-title" fill="#9b2c2c">TRADITIONAL MONOLITH: THE "EXTRACTION TRAP"</text>

    <!-- Card 1: Monolithic Spring App -->
    <g transform="translate(20, 58)">
      <rect width="430" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="16" y="24" class="card-title">1. Single-Process Spring Boot Monolith</text>
      <rect x="16" y="36" width="398" height="85" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
      <text x="28" y="55" font-family="monospace" font-size="10" fill="#c53030" font-weight="bold">@Transactional placeOrder(...) {</text>
      <text x="42" y="72" font-family="monospace" font-size="10" fill="#4a5568">orderRepository.save(order);</text>
      <text x="42" y="88" font-family="monospace" font-size="10" fill="#4a5568">paymentService.chargeCreditCard(order); // shared DB lock</text>
      <text x="42" y="104" font-family="monospace" font-size="10" fill="#4a5568">inventoryService.decrementStock(order); // shared entity</text>
      <text x="28" y="116" font-family="monospace" font-size="10" fill="#c53030" font-weight="bold">}</text>
    </g>

    <!-- Card 2: Database Entanglement -->
    <g transform="translate(20, 208)">
      <rect width="430" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="16" y="24" class="card-title">2. Database Relational Coupling</text>
      
      <g transform="translate(16, 36)">
        <rect width="120" height="88" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
        <text x="60" y="22" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#2d3748">orders table</text>
        <text x="10" y="42" class="body-text">• id (PK)</text>
        <text x="10" y="58" class="body-text">• customer_id</text>
        <text x="10" y="74" class="body-text">• total_amount</text>
      </g>

      <path d="M 136 78 L 165 78" class="arrow-red"/>

      <g transform="translate(170, 36)">
        <rect width="120" height="88" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
        <text x="60" y="22" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#2d3748">payments table</text>
        <text x="10" y="42" class="body-text">• id (PK)</text>
        <text x="10" y="58" class="body-text" fill="#c53030">• order_id (FK)</text>
        <text x="10" y="74" class="body-text">• status</text>
      </g>

      <path d="M 290 78 L 315 78" class="arrow-red"/>

      <g transform="translate(320, 36)">
        <rect width="94" height="88" rx="6" fill="#edf2f7" stroke="#cbd5e0"/>
        <text x="47" y="22" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#2d3748">inventory</text>
        <text x="8" y="42" class="body-text">• item_id</text>
        <text x="8" y="58" class="body-text" fill="#c53030">• join_fk</text>
        <text x="8" y="74" class="body-text">• stock_qty</text>
      </g>
    </g>

    <!-- Card 3: The Fatal Wall -->
    <g transform="translate(20, 363)">
      <rect width="430" height="160" rx="8" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="9" fill="#c53030"/>
      <text x="24" y="22" class="badge-text">!</text>
      <text x="40" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9b2c2c">THE EXTRACTION DISASTER (Day N Migration)</text>
      
      <text x="16" y="52" class="body-text" font-weight="bold" fill="#742a2a">• ACID Transactions Cannot Cross the Network:</text>
      <text x="26" y="68" class="body-text">Moving PaymentService to a microservice breaks @Transactional boundary.</text>
      
      <text x="16" y="88" class="body-text" font-weight="bold" fill="#742a2a">• Dual-Write &amp; Partial Failure Data Corruption:</text>
      <text x="26" y="104" class="body-text">If inventory fails, DB rollback only undoes local tables. Remote payment is charged!</text>
      
      <rect x="16" y="116" width="398" height="32" rx="4" fill="#742a2a"/>
      <text x="215" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">FATAL RESULT: Multi-Month High-Risk Transactional Rewrite</text>
    </g>
  </g>

  <!-- RIGHT PANEL: STACKSAGA MODULITH (MICROSERVICES-READY) -->
  <g transform="translate(540, 75)">
    <!-- Panel Container -->
    <rect width="470" height="540" rx="10" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Panel Header -->
    <rect width="470" height="42" rx="10" fill="#e6fffa" stroke="#81e6d9" stroke-width="1"/>
    <rect y="32" width="470" height="10" fill="#e6fffa"/>
    <circle cx="24" cy="21" r="10" fill="#28b86c"/>
    <text x="24" y="21" class="badge-text">✓</text>
    <text x="245" y="21" class="header-title" fill="#234e52">STACKSAGA: MODULITH TODAY, MICROSERVICES TOMORROW</text>

    <!-- Card 1: Modulith with Atomic Saga Executors -->
    <g transform="translate(20, 58)">
      <rect width="430" height="135" rx="8" fill="#ffffff" stroke="#b2f5ea" stroke-width="1.2"/>
      <text x="16" y="24" class="card-title">1. Atomic Saga Executor Boundaries (In-Process &lt;1ms)</text>
      <rect x="16" y="36" width="398" height="85" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
      <text x="28" y="55" font-family="monospace" font-size="10" fill="#22543d" font-weight="bold">@SagaExecutor public class MakePaymentExecutor</text>
      <text x="42" y="72" font-family="monospace" font-size="10" fill="#4a5568">implements CommandExecutor&lt;OrderDomainEntity&gt; {</text>
      <text x="42" y="88" font-family="monospace" font-size="10" fill="#276749">doProcess(...) // In-process memory call on Day 1 (&lt;1ms)</text>
      <text x="42" y="104" font-family="monospace" font-size="10" fill="#276749">doRevert(...)  // Symmetrical compensation defined upfront</text>
      <text x="28" y="116" font-family="monospace" font-size="10" fill="#22543d" font-weight="bold">}</text>
    </g>

    <!-- Card 2: Isolated Schemas + Saga Event Store -->
    <g transform="translate(20, 208)">
      <rect width="430" height="140" rx="8" fill="#ffffff" stroke="#b2f5ea" stroke-width="1.2"/>
      <text x="16" y="24" class="card-title">2. Clean Schema Isolation + Embedded Event Store</text>
      
      <g transform="translate(16, 36)">
        <rect width="120" height="88" rx="6" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="60" y="20" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#234e52">order_schema</text>
        <text x="10" y="38" class="body-text">• ord_orders</text>
        <text x="10" y="54" class="body-text">• ord_items</text>
        <text x="10" y="76" font-family="sans-serif" font-size="9" fill="#28b86c" font-weight="bold">✓ No Cross-FK</text>
      </g>

      <path d="M 136 78 L 165 78" class="arrow-green"/>

      <g transform="translate(170, 36)">
        <rect width="120" height="88" rx="6" fill="#f0fff4" stroke="#9ae6b4"/>
        <text x="60" y="20" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#234e52">payment_schema</text>
        <text x="10" y="38" class="body-text">• pay_transactions</text>
        <text x="10" y="54" class="body-text">• pay_audit</text>
        <text x="10" y="76" font-family="sans-serif" font-size="9" fill="#28b86c" font-weight="bold">✓ No Cross-FK</text>
      </g>

      <path d="M 290 78 L 315 78" class="arrow-green"/>

      <g transform="translate(320, 36)">
        <rect width="94" height="88" rx="6" fill="#ebf8ff" stroke="#bee3f8"/>
        <text x="47" y="20" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2b6cb0">Event Store</text>
        <text x="8" y="38" font-family="sans-serif" font-size="9" fill="#2b6cb0">• snapshots</text>
        <text x="8" y="54" font-family="sans-serif" font-size="9" fill="#2b6cb0">• audit log</text>
        <text x="8" y="76" font-family="sans-serif" font-size="9" fill="#28b86c" font-weight="bold">✓ Immutable</text>
      </g>
    </g>

    <!-- Card 3: Zero-Rewrite Extraction -->
    <g transform="translate(20, 363)">
      <rect width="430" height="160" rx="8" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="9" fill="#28b86c"/>
      <text x="24" y="22" class="badge-text">✓</text>
      <text x="40" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#22543d">THE ZERO-REWRITE EXTRACTION (Scale Day N)</text>
      
      <text x="16" y="52" class="body-text" font-weight="bold" fill="#22543d">• Only Transport Call Swaps (1 Line of Code):</text>
      <text x="26" y="68" class="body-text">paymentInternalService.charge() → paymentServiceClient.chargeRemote()</text>
      
      <text x="16" y="88" class="body-text" font-weight="bold" fill="#22543d">• 100% Intact Orchestration Architecture:</text>
      <text x="26" y="104" class="body-text">OrderDomainEntity, step graph, reverse rollback, event log remain untouched!</text>
      
      <rect x="16" y="116" width="398" height="32" rx="4" fill="#276749"/>
      <text x="215" y="136" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ARCHITECTURAL FREEDOM: Extract in Hours, Not Months</text>
    </g>
  </g>
</svg>
