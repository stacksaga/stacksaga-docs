<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1080px" height="510px" viewBox="0 0 1080 510" style="background:#ffffff; background-color:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-c" x="-3%" y="-5%" width="108%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Continuous Long-Running Transaction (Continuous LRT)</text>
  <text x="540" y="53" text-anchor="middle" font-size="12" fill="#64748b">Straight-Through Processing (STP) — Sequential microservice flow with no business wait states</text>

  <!-- ================= ORCHESTRATOR CONTAINER ================= -->
  <rect x="25" y="70" width="1030" height="230" rx="10" fill="#f8fafc" stroke="#10b981" stroke-width="2" filter="url(#shadow-c)"/>
  <rect x="25" y="70" width="280" height="26" rx="6" fill="#10b981"/>
  <text x="37" y="88" font-size="12" font-weight="700" fill="#ffffff">Orchestrator Service (order-service)</text>

  <!-- 1. Client Inbound -->
  <rect x="45" y="125" width="105" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-c)"/>
  <text x="97.5" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Client Request</text>
  <text x="97.5" y="164" text-anchor="middle" font-size="9" fill="#64748b">POST /orders</text>

  <path d="M 150 152 L 182 152" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="166" y="145" text-anchor="middle" font-size="8.5" fill="#64748b">startWith()</text>

  <!-- 2. SEC & SagaTemplate -->
  <rect x="188" y="120" width="130" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow-c)"/>
  <text x="253" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">SagaTemplate</text>
  <text x="253" y="161" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">&amp; SEC Engine</text>
  <text x="253" y="174" text-anchor="middle" font-size="8" fill="#059669">Execution Coordinator</text>

  <!-- Event Store Database Cylinder -->
  <g transform="translate(208, 206)">
    <path d="M 0 8 A 45 8 0 0 0 90 8 L 90 42 A 45 8 0 0 1 0 42 Z" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="45" cy="8" rx="45" ry="7" fill="#e2e8f0" stroke="#059669" stroke-width="1.5"/>
    <text x="45" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Event Store</text>
    <text x="45" y="37" text-anchor="middle" font-size="8" fill="#64748b">Domain Snapshots</text>
  </g>
  <path d="M 253 184 L 253 204" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Link SEC to Span 1 -->
  <path d="M 318 152 L 342 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- SPAN 1: InitializeOrder (w=110, h=64) -->
  <g transform="translate(348, 120)">
    <rect width="110" height="64" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-c)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Span 1</text>
    <text x="55" y="36" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">InitializeOrder</text>
    <text x="55" y="49" text-anchor="middle" font-size="8" fill="#64748b">Executor</text>
    <text x="55" y="59" text-anchor="middle" font-size="7.5" fill="#0284c7">(order-service)</text>
  </g>

  <!-- Arrow Span 1 -> Span 2 -->
  <path d="M 458 152 L 482 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="470" y="145" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">next()</text>

  <!-- SPAN 2: ValidateUser (w=110, h=64) -->
  <g transform="translate(488, 120)">
    <rect width="110" height="64" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-c)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Span 2</text>
    <text x="55" y="37" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">ValidateUser</text>
    <text x="55" y="51" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Span 2 -> Span 3 -->
  <path d="M 598 152 L 622 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="610" y="145" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">next()</text>

  <!-- SPAN 3: ReserveItems (w=110, h=64) -->
  <g transform="translate(628, 120)">
    <rect width="110" height="64" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-c)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Span 3</text>
    <text x="55" y="37" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">ReserveItems</text>
    <text x="55" y="51" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Span 3 -> Span 4 -->
  <path d="M 738 152 L 762 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="750" y="145" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">next()</text>

  <!-- SPAN 4: MakePayment (w=110, h=64) -->
  <g transform="translate(768, 120)">
    <rect width="110" height="64" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-c)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">4</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Span 4</text>
    <text x="55" y="37" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">MakePayment</text>
    <text x="55" y="51" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Span 4 -> Span 5 -->
  <path d="M 878 152 L 902 152" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="890" y="145" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">next()</text>

  <!-- SPAN 5: DispatchDelivery (w=110, h=64) -->
  <g transform="translate(908, 120)">
    <rect width="110" height="64" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-c)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">5</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Span 5</text>
    <text x="55" y="35" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">DispatchDelivery</text>
    <text x="55" y="49" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Span 5 -> Completed Badge -->
  <path d="M 963 184 L 963 218" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="980" y="204" font-size="8" font-weight="600" fill="#059669">complete()</text>

  <!-- COMPLETED TERMINAL BADGE -->
  <g transform="translate(903, 225)">
    <rect width="120" height="40" rx="20" fill="#10b981" stroke="#059669" stroke-width="1.5" filter="url(#shadow-c)"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">COMPLETED</text>
    <text x="60" y="32" text-anchor="middle" font-size="8" fill="#ecfdf5">stepManager.complete()</text>
  </g>

  <!-- ================= DOWNSTREAM UTILITY SERVICES ================= -->
  <rect x="25" y="325" width="1030" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#shadow-c)"/>
  <text x="40" y="344" font-size="11" font-weight="700" fill="#475569">Participating Utility Microservices (Zero StackSaga Dependency)</text>

  <!-- user-service (aligned with Span 2: x=488) -->
  <g transform="translate(488, 355)">
    <rect width="110" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-c)"/>
    <text x="55" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">user-service</text>
    <text x="55" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">REST / gRPC</text>
  </g>

  <!-- inventory-service (aligned with Span 3: x=628) -->
  <g transform="translate(628, 355)">
    <rect width="110" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-c)"/>
    <text x="55" y="25" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">inventory-service</text>
    <text x="55" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">REST / gRPC</text>
  </g>

  <!-- payment-service (aligned with Span 4: x=768) -->
  <g transform="translate(768, 355)">
    <rect width="110" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-c)"/>
    <text x="55" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">payment-service</text>
    <text x="55" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">REST / gRPC</text>
  </g>

  <!-- delivery-service (aligned with Span 5: x=908) -->
  <g transform="translate(908, 355)">
    <rect width="110" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-c)"/>
    <text x="55" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">delivery-service</text>
    <text x="55" y="42" text-anchor="middle" font-size="8.5" fill="#64748b">REST / gRPC</text>
  </g>

  <!-- Perfectly vertical synchronous call lines -->
  <path d="M 543 184 L 543 349" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <path d="M 683 184 L 683 349" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <path d="M 823 184 L 823 349" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <path d="M 963 265 L 963 349" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>

  <!-- Bottom Annotation Bar -->
  <rect x="25" y="455" width="1030" height="34" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="540" y="476" text-anchor="middle" font-size="11" fill="#166534">
    <tspan font-weight="700">Straight-Through Flow:</tspan> Execution progresses sequentially across microservices without stopping. Pauses occur solely on transient errors handled by the Ring Coordinator retry subsystem.
  </text>
</svg>
