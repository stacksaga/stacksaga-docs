<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1080px" height="520px" viewBox="0 0 1080 520" style="background:#ffffff; background-color:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-pause" x="-3%" y="-5%" width="108%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Pausable Long-Running Transaction (Pausable LRT)</text>
  <text x="540" y="53" text-anchor="middle" font-size="12" fill="#64748b">Wait-State Workflow — Intentional business wait state awaiting external callback (Uber / Async Webhook Use Case)</text>

  <!-- ================= ORCHESTRATOR CONTAINER ================= -->
  <rect x="25" y="70" width="1030" height="245" rx="10" fill="#f8fafc" stroke="#10b981" stroke-width="2" filter="url(#shadow-pause)"/>
  <rect x="25" y="70" width="280" height="26" rx="6" fill="#10b981"/>
  <text x="37" y="88" font-size="12" font-weight="700" fill="#ffffff">Orchestrator Service (order-service)</text>

  <!-- 1. Client Inbound -->
  <rect x="45" y="125" width="100" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-pause)"/>
  <text x="95" y="147" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Client Request</text>
  <text x="95" y="164" text-anchor="middle" font-size="9" fill="#64748b">POST /orders</text>

  <path d="M 145 153 L 175 153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="160" y="146" text-anchor="middle" font-size="8.5" fill="#64748b">startWith()</text>

  <!-- 2. SEC & SagaTemplate -->
  <rect x="180" y="120" width="122" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow-pause)"/>
  <text x="241" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">SagaTemplate</text>
  <text x="241" y="161" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">&amp; SEC Engine</text>
  <text x="241" y="174" text-anchor="middle" font-size="8" fill="#059669">Execution Coordinator</text>

  <!-- Event Store Database Cylinder -->
  <g transform="translate(198, 204)">
    <path d="M 0 8 A 43 7.5 0 0 0 86 8 L 86 40 A 43 7.5 0 0 1 0 40 Z" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="43" cy="8" rx="43" ry="6.5" fill="#e2e8f0" stroke="#059669" stroke-width="1.5"/>
    <text x="43" y="24" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Event Store</text>
    <text x="43" y="36" text-anchor="middle" font-size="7.5" fill="#64748b">State &amp; Keys</text>
  </g>
  <path d="M 241 186 L 241 204" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Link SEC to Step 1 -->
  <path d="M 302 153 L 326 153" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- STEP 1: InitializeOrder (w=108, h=66) -->
  <g transform="translate(330, 120)">
    <rect width="108" height="66" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-pause)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">1</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Step 1</text>
    <text x="54" y="37" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">InitializeOrder</text>
    <text x="54" y="51" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Step 1 -> Step 2 -->
  <path d="M 438 153 L 468 153" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="453" y="146" text-anchor="middle" font-size="8" font-weight="600" fill="#0284c7">next()</text>

  <!-- STEP 2: NotifyRestaurant (Pausable Step, w=122, h=72) -->
  <g transform="translate(472, 117)">
    <rect width="122" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow-pause)"/>
    <circle cx="15" cy="15" r="7.5" fill="#d97706"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">2</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#b45309">Step 2 (Pausable)</text>
    <text x="61" y="37" text-anchor="middle" font-size="9.5" font-weight="700" fill="#78350f">NotifyRestaurant</text>
    <text x="61" y="50" text-anchor="middle" font-size="8" fill="#92400e">Executor</text>
    <text x="61" y="62" text-anchor="middle" font-size="7.5" font-weight="700" fill="#b45309">stepManager.pause()</text>
  </g>

  <!-- Arrow Step 2 -> PAUSED Box -->
  <path d="M 594 153 L 624 153" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="609" y="145" text-anchor="middle" font-size="8" font-weight="700" fill="#d97706">pause()</text>

  <!-- PAUSED (WAIT STATE) Card (w=150, h=76) -->
  <g transform="translate(628, 115)">
    <rect width="150" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" filter="url(#shadow-pause)"/>
    <rect x="8" y="7" width="134" height="18" rx="4" fill="#fef3c7"/>
    <text x="75" y="20" text-anchor="middle" font-size="9.5" font-weight="800" fill="#b45309">PAUSED (WAIT STATE)</text>
    <text x="75" y="38" text-anchor="middle" font-size="8" fill="#78350f">• Worker threads released</text>
    <text x="75" y="50" text-anchor="middle" font-size="8" fill="#78350f">• State in Event Store</text>
    <text x="75" y="63" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">Awaiting external callback</text>
  </g>

  <!-- Callback Controller in Orchestrator (w=150, h=70) -->
  <g transform="translate(628, 206)">
    <rect width="150" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow-pause)"/>
    <text x="75" y="21" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">Callback Controller</text>
    <text x="75" y="35" text-anchor="middle" font-size="8.5" fill="#047857">POST /order-ready</text>
    <rect x="10" y="44" width="130" height="18" rx="4" fill="#d1fae5"/>
    <text x="75" y="56" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">sagaTemplate.resume(tx, key)</text>
  </g>

  <!-- Arrow: Callback Controller -> Step 3 -->
  <path d="M 778 241 L 798 241 L 798 153 L 814 153" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="800" y="210" text-anchor="middle" font-size="8.5" font-weight="700" fill="#059669">resume()</text>

  <!-- STEP 3: DispatchDelivery (w=112, h=66) -->
  <g transform="translate(818, 120)">
    <rect width="112" height="66" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-pause)"/>
    <circle cx="15" cy="15" r="7.5" fill="#0284c7"/>
    <text x="15" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">3</text>
    <text x="27" y="18" font-size="8.5" font-weight="700" fill="#0284c7">Step 3 (Resumed)</text>
    <text x="56" y="37" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">DispatchDelivery</text>
    <text x="56" y="51" text-anchor="middle" font-size="8.5" fill="#64748b">Executor</text>
  </g>

  <!-- Arrow Step 3 -> Completed -->
  <path d="M 930 153 L 954 153" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="942" y="146" text-anchor="middle" font-size="8" font-weight="600" fill="#059669">complete()</text>

  <!-- COMPLETED TERMINAL BADGE (w=86, h=40) -->
  <g transform="translate(958, 133)">
    <rect width="86" height="40" rx="20" fill="#10b981" stroke="#059669" stroke-width="1.5" filter="url(#shadow-pause)"/>
    <text x="43" y="19" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">COMPLETED</text>
    <text x="43" y="31" text-anchor="middle" font-size="7.5" fill="#ecfdf5">stepManager</text>
  </g>

  <!-- ================= DOWNSTREAM EXTERNAL SERVICES ================= -->
  <rect x="25" y="335" width="1030" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#shadow-pause)"/>
  <text x="40" y="354" font-size="11" font-weight="700" fill="#475569">Participating Microservices &amp; Real-World Asynchronous Actors</text>

  <!-- restaurant-service (aligned with Step 2: center x=533) -->
  <g transform="translate(448, 368)">
    <rect width="170" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow-pause)"/>
    <text x="85" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">restaurant-service</text>
    <text x="85" y="40" text-anchor="middle" font-size="8.5" fill="#b45309">Kitchen Cooks Order (20-40 min)</text>
    <text x="85" y="52" text-anchor="middle" font-size="8" fill="#d97706">Stores idempotencyKey</text>
  </g>

  <!-- delivery-service (aligned with Step 3: center x=874) -->
  <g transform="translate(804, 368)">
    <rect width="140" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-pause)"/>
    <text x="70" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">delivery-service</text>
    <text x="70" y="40" text-anchor="middle" font-size="8.5" fill="#64748b">Courier Dispatch</text>
    <text x="70" y="52" text-anchor="middle" font-size="8" fill="#94a3b8">REST / gRPC</text>
  </g>

  <!-- Line 1: Step 2 calls Restaurant (downward at x=533) -->
  <path d="M 533 189 L 533 364" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <g transform="translate(458, 258)">
    <rect width="150" height="20" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="14" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b45309">1. Passes idempotencyKey</text>
  </g>

  <!-- Line 2: Restaurant Callback to Controller (upward at x=703) -->
  <path d="M 618 398 L 703 398 L 703 280" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(635, 330)">
    <rect width="150" height="22" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="75" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#065f46">2. Callback: key = idempotencyKey</text>
  </g>

  <!-- Line 3: Step 3 calls Delivery Service (downward dashed at x=874) -->
  <path d="M 874 186 L 874 364" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <g transform="translate(814, 258)">
    <rect width="120" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="14" text-anchor="middle" font-size="8.5" fill="#475569">3. Dispatch Order</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="25" y="465" width="1030" height="36" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="540" y="487" text-anchor="middle" font-size="11" fill="#92400e">
    <tspan font-weight="700">Pausable Flow:</tspan> Deliberate business wait state. The saga sleeps safely in the event store without holding CPU threads until the external webhook callback returns the correlation key (idempotencyKey) to resume execution.
  </text>
</svg>
