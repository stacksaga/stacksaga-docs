<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" style="background:#FAFBFD; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="glowGreen" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
    <filter id="glowAmber" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#D97706" flood-opacity="0.14"/>
    </filter>

    <!-- Marker Arrow (Blue) -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#3B82F6"/>
    </marker>

    <!-- Marker Arrow (Amber) -->
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#D97706"/>
    </marker>

    <!-- Marker Arrow (Green) -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#059669"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="tierCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="windowClosedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="windowActiveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">StackSaga Dual-Window Synchronization Model</text>
    <text x="0" y="38" font-size="12" font-weight="400" fill="#64748B">Temporal writer-reader separation: Write-ahead to W+1 with sealed read-window traversal and automatic cooldown</text>
  </g>

  <!-- ==================== UPPER SWIMLANE: LIVE APPLICATION PODS (WRITERS) ==================== -->
  <g transform="translate(490, 68)">
    <rect x="0" y="0" width="450" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 3 -->
    <circle cx="32" cy="37" r="16" fill="#2563EB"/>
    <text x="32" y="42" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- Text -->
    <text x="60" y="28" font-size="13" font-weight="700" fill="#0F172A">Live Application Pods (Write-Ahead Rule)</text>
    <text x="60" y="45" font-size="11" font-weight="500" fill="#64748B">Encounter failure during Window W (T_now = 10:14:25 UTC)</text>
    <text x="60" y="60" font-size="10" font-weight="600" fill="#D97706">Bypasses Window W → Registers failure directly in Window W+1</text>

    <!-- Pill Tag -->
    <rect x="364" y="14" width="72" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="400" y="29" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Writers</text>
  </g>

  <!-- Straight Vertical Write-Ahead Arrow: From Pods (Y=142) straight down to Window W+1 top (Y=220) at X=615 -->
  <line x1="615" y1="142" x2="615" y2="218" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  
  <rect x="626" y="168" width="124" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="688" y="182.5" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">Writes Ahead to W+1</text>

  <!-- Current Wall-Clock Indicator -->
  <g transform="translate(365, 142)">
    <line x1="0" y1="20" x2="0" y2="76" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="3,2"/>
    <circle cx="0" cy="76" r="4" fill="#EF4444"/>
    <rect x="-65" y="0" width="130" height="20" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="0" y="13.5" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">T_now = 10:14:25 UTC</text>
  </g>

  <!-- ==================== HORIZONTAL TIMELINE AXIS ==================== -->
  <line x1="40" y1="218" x2="940" y2="218" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="940,214 948,218 940,222" fill="#94A3B8"/>
  <text x="930" y="208" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="end">Time Progression (UTC) ──►</text>

  <!-- ==================== WINDOW CARDS ==================== -->

  <!-- Window W-1 (Past / Compacted) -->
  <g transform="translate(40, 226)">
    <rect x="0" y="0" width="190" height="128" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#64748B">Window W-1</text>
    <text x="14" y="42" font-size="11" font-weight="500" fill="#94A3B8">10:13 UTC (Past)</text>

    <rect x="14" y="54" width="130" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="79" y="67" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">COMPACTED &amp; DROPPED</text>

    <text x="14" y="92" font-size="10" font-weight="500" fill="#94A3B8">• Partitions deleted via O(1)</text>
    <text x="14" y="108" font-size="10" font-weight="500" fill="#94A3B8">• Zero remaining records</text>
  </g>

  <!-- Window W (Closed Read-Window, Center at X=365) -->
  <g transform="translate(250, 226)">
    <rect x="0" y="0" width="230" height="128" rx="8" fill="url(#windowClosedBg)" stroke="#059669" stroke-width="1.8" filter="url(#glowGreen)"/>
    
    <!-- Badge 1 -->
    <circle cx="26" cy="26" r="14" fill="#059669"/>
    <text x="26" y="31" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

    <text x="48" y="24" font-size="13" font-weight="700" fill="#065F46">Window W</text>
    <text x="48" y="38" font-size="10.5" font-weight="500" fill="#047857">10:14 UTC (Closed Window)</text>

    <!-- Pill Tag -->
    <rect x="14" y="52" width="118" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="73" y="65" font-size="9.5" font-weight="700" fill="#065F46" text-anchor="middle">SEALED TO WRITES</text>

    <text x="14" y="90" font-size="10" font-weight="600" fill="#0F172A">• Active retry worker traversal</text>
    <text x="14" y="106" font-size="10" font-weight="500" fill="#047857">• Dropped when buckets finish</text>
  </g>

  <!-- Window W+1 (Active Write-Window, Center at X=615) -->
  <g transform="translate(500, 226)">
    <rect x="0" y="0" width="230" height="128" rx="8" fill="url(#windowActiveBg)" stroke="#D97706" stroke-width="1.8" filter="url(#glowAmber)"/>
    
    <!-- Badge 2 -->
    <circle cx="26" cy="26" r="14" fill="#D97706"/>
    <text x="26" y="31" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

    <text x="48" y="24" font-size="13" font-weight="700" fill="#92400E">Window W+1</text>
    <text x="48" y="38" font-size="10.5" font-weight="500" fill="#B45309">10:15 UTC (Write Target)</text>

    <!-- Pill Tag -->
    <rect x="14" y="52" width="120" height="20" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="74" y="65" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">OPEN FOR WRITES</text>

    <text x="14" y="90" font-size="10" font-weight="600" fill="#0F172A">• Receives all current failures</text>
    <text x="14" y="106" font-size="10" font-weight="500" fill="#B45309">• Zero worker read interference</text>
  </g>

  <!-- Window W+2 (Scheduled Future) -->
  <g transform="translate(750, 226)">
    <rect x="0" y="0" width="190" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#64748B">Window W+2</text>
    <text x="14" y="42" font-size="11" font-weight="500" fill="#94A3B8">10:16 UTC (Future)</text>

    <rect x="14" y="54" width="94" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="61" y="67" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">SCHEDULED</text>

    <text x="14" y="92" font-size="10" font-weight="500" fill="#94A3B8">• Becomes W+1 at 10:15</text>
    <text x="14" y="108" font-size="10" font-weight="500" fill="#94A3B8">• Zero current activity</text>
  </g>

  <!-- ==================== LOWER SWIMLANE: WORKERS & COOLDOWN ==================== -->

  <!-- Straight Vertical Read Arrow: From Retry Workers (Y=395) straight up to Window W bottom (Y=356) at X=365 -->
  <line x1="365" y1="395" x2="365" y2="358" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <rect x="252" y="364" width="102" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="303" y="377" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Reads Sealed &lt;= W</text>

  <!-- Retry Workers Card (Center at X=265) -->
  <g transform="translate(40, 395)">
    <rect x="0" y="0" width="440" height="82" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 4 -->
    <circle cx="32" cy="41" r="16" fill="#2563EB"/>
    <text x="32" y="46" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

    <!-- Text -->
    <text x="60" y="29" font-size="13" font-weight="700" fill="#0F172A">Retry Workers (Sealed Read &amp; Compaction Path)</text>
    <text x="60" y="46" font-size="11" font-weight="500" fill="#64748B">Queries only completed, closed windows (minute_of_day &lt;= W)</text>
    <text x="60" y="63" font-size="10" font-weight="600" fill="#059669">Zero lock contention • No phantom reads • Partition dropped at end</text>

    <!-- Pill Tag -->
    <rect x="354" y="14" width="72" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="390" y="29" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Readers</text>
  </g>

  <!-- Automatic Cooldown Card (Center at X=720) -->
  <g transform="translate(500, 395)">
    <rect x="0" y="0" width="440" height="82" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4" filter="url(#glowAmber)"/>
    
    <!-- Badge 5 -->
    <circle cx="32" cy="41" r="16" fill="#D97706"/>
    <text x="32" y="46" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>

    <!-- Text -->
    <text x="60" y="29" font-size="13" font-weight="700" fill="#92400E">Automatic Cooldown Period (10s – 70s Buffer)</text>
    <text x="60" y="46" font-size="11" font-weight="500" fill="#B45309">Errors at 10:14:25 UTC are only eligible for retry once Window W+1 seals</text>
    <text x="60" y="63" font-size="10" font-weight="600" fill="#92400E">Protects downstream services from immediate hammering during outages</text>

    <!-- Pill Tag -->
    <rect x="340" y="14" width="86" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="383" y="29" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">10s-70s Buffer</text>
  </g>

</svg>
