<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="100%" height="100%" style="background:#FAFBFD; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="glowGreen" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
    <filter id="glowPurple" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>

    <!-- Marker Arrow (Blue) -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#3B82F6"/>
    </marker>

    <!-- Marker Arrow (Purple) -->
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#7C3AED"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="tierCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="tier5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">StackSaga 5-Tier Retry Directory &amp; Event Store Architecture</text>
    <text x="0" y="38" font-size="12" font-weight="400" fill="#64748B">Top-down active directory routing with partition-level drops and decoupled event storage</text>
  </g>

  <!-- ==================== TIER 1: es_days_by_year ==================== -->
  <g transform="translate(40, 75)">
    <!-- Connecting Arrow to Tier 2 -->
    <line x1="240" y1="68" x2="240" y2="98" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="0" y="0" width="480" height="68" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 1 -->
    <circle cx="34" cy="34" r="16" fill="#2563EB"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    
    <!-- Text -->
    <text x="64" y="27" font-size="14" font-weight="700" fill="#0F172A">es_days_by_year</text>
    <text x="64" y="44" font-size="11" font-weight="500" fill="#64748B">Tier 1: Active Calendar Date Directory</text>
    <text x="64" y="58" font-size="10" font-weight="400" fill="#94A3B8">PK: ((region, cluster, service_name), date_of_year ASC)</text>

    <!-- Pill Tag -->
    <rect x="360" y="14" width="106" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="413" y="29" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">Active Dates</text>
  </g>

  <!-- ==================== TIER 2: es_retry_windows_by_day ==================== -->
  <g transform="translate(40, 175)">
    <!-- Connecting Arrow to Tier 3 -->
    <line x1="240" y1="68" x2="240" y2="98" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="0" y="0" width="480" height="68" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 2 -->
    <circle cx="34" cy="34" r="16" fill="#2563EB"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    
    <!-- Text -->
    <text x="64" y="27" font-size="14" font-weight="700" fill="#0F172A">es_retry_windows_by_day</text>
    <text x="64" y="44" font-size="11" font-weight="500" fill="#64748B">Tier 2: UTC Minute Window Directory</text>
    <text x="64" y="58" font-size="10" font-weight="400" fill="#94A3B8">PK: ((region, cluster, service_name, date_of_year), minute_of_day ASC)</text>

    <!-- Pill Tag -->
    <rect x="344" y="14" width="122" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="405" y="29" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">0..1439 UTC Windows</text>
  </g>

  <!-- ==================== TIER 3: es_instances_by_retry_window ==================== -->
  <g transform="translate(40, 275)">
    <!-- Connecting Arrow to Tier 4 -->
    <line x1="240" y1="68" x2="240" y2="98" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="0" y="0" width="480" height="68" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 3 -->
    <circle cx="34" cy="34" r="16" fill="#2563EB"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    
    <!-- Text -->
    <text x="64" y="27" font-size="14" font-weight="700" fill="#0F172A">es_instances_by_retry_window</text>
    <text x="64" y="44" font-size="11" font-weight="500" fill="#64748B">Tier 3: Token-Partitioned Worker Slicing</text>
    <text x="64" y="58" font-size="10" font-weight="400" fill="#94A3B8">Clustering: (instance_id_token ASC, instance_id ASC)</text>

    <!-- Pill Tag -->
    <rect x="344" y="14" width="122" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="405" y="29" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">Murmur3 Token Leased</text>
  </g>

  <!-- ==================== TIER 4: es_buckets_by_instance ==================== -->
  <g transform="translate(40, 375)">
    <!-- Connecting Arrow to Tier 5 -->
    <line x1="240" y1="68" x2="240" y2="98" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="0" y="0" width="480" height="68" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 4 -->
    <circle cx="34" cy="34" r="16" fill="#2563EB"/>
    <text x="34" y="39" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    
    <!-- Text -->
    <text x="64" y="27" font-size="14" font-weight="700" fill="#0F172A">es_buckets_by_instance</text>
    <text x="64" y="44" font-size="11" font-weight="500" fill="#64748B">Tier 4: Bucket Index Allocation Directory</text>
    <text x="64" y="58" font-size="10" font-weight="400" fill="#94A3B8">Clustering: bucket_index ASC (0, 1, 2...)</text>

    <!-- Pill Tag -->
    <rect x="340" y="14" width="126" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="403" y="29" font-size="10" font-weight="600" fill="#1D4ED8" text-anchor="middle">In-Memory Rollover</text>
  </g>

  <!-- ==================== TIER 5: es_retry_transactions_by_instance ==================== -->
  <g transform="translate(30, 475)">
    <rect x="0" y="0" width="500" height="135" rx="10" fill="url(#tier5Bg)" stroke="#10B981" stroke-width="1.8" filter="url(#glowGreen)"/>
    
    <!-- Badge 5 -->
    <circle cx="36" cy="36" r="18" fill="#059669"/>
    <text x="36" y="42" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    
    <!-- Title & Description -->
    <text x="68" y="32" font-size="15" font-weight="700" fill="#065F46">es_retry_transactions_by_instance</text>
    <text x="68" y="50" font-size="12" font-weight="500" fill="#047857">Tier 5: Bounded Transaction Metadata Partitions</text>
    <text x="68" y="66" font-size="11" font-weight="400" fill="#475569">PK: ((..., instance_id, bucket_index), transaction_id ASC)</text>

    <!-- Badges Row -->
    <g transform="translate(68, 80)">
      <!-- Pill 1: Bounded size -->
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
      <text x="84" y="16" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">Capped &lt; 50k Rows (&lt; 100MB)</text>

      <!-- Pill 2: O(1) drop -->
      <rect x="178" y="0" width="180" height="24" rx="12" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
      <text x="268" y="16" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">O(1) Partition Drop (1 Tombstone)</text>
    </g>

    <text x="68" y="122" font-size="11" font-style="italic" fill="#059669">&#x2713; Lightweight Metadata Only (~50B/row) &#x2014; No Heavy Business Payload</text>
  </g>

  <!-- ==================== CONNECTOR: TIER 5 TO EVENT STORE ==================== -->
  <g transform="translate(530, 520)">
    <!-- Curved/Dashed Line to Event Store -->
    <path d="M 0 20 L 48 20" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowPurple)"/>
    <!-- Tag on top of arrow -->
    <rect x="-8" y="-14" width="70" height="18" rx="9" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="27" y="-1" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">Lazy Fetch</text>
  </g>

  <!-- ==================== TIER 6: PRIMARY EVENT STORE ==================== -->
  <g transform="translate(585, 275)">
    <rect x="0" y="0" width="355" height="335" rx="12" fill="url(#storeBg)" stroke="#8B5CF6" stroke-width="1.8" filter="url(#glowPurple)"/>

    <!-- Badge 6 -->
    <circle cx="36" cy="36" r="18" fill="#7C3AED"/>
    <text x="36" y="42" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    
    <!-- Title & Description -->
    <text x="68" y="32" font-size="15" font-weight="700" fill="#4C1D95">Primary Transaction Event Store</text>
    <text x="68" y="50" font-size="11" font-weight="500" fill="#6D28D9">Decoupled Heavy Business State &amp; Step Logs</text>

    <!-- Table A: es_transaction -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="315" height="96" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <rect x="10" y="10" width="100" height="18" rx="4" fill="#EDE9FE"/>
      <text x="60" y="23" font-size="10" font-weight="700" fill="#5B21B6" text-anchor="middle">Single-Row Partition</text>

      <text x="10" y="46" font-size="13" font-weight="700" fill="#1E1B4B">es_transaction</text>
      <text x="10" y="62" font-size="10.5" font-weight="500" fill="#64748B">PK: transaction_id</text>
      <text x="10" y="80" font-size="10" font-weight="400" fill="#7C3AED">&#x2022; Saga Aggregator State, Status &amp; Error Logs</text>
    </g>

    <!-- Table B: es_transaction_tryout -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="315" height="96" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#EDE9FE"/>
      <text x="62" y="23" font-size="10" font-weight="700" fill="#5B21B6" text-anchor="middle">Multi-Row Partition</text>

      <text x="10" y="46" font-size="13" font-weight="700" fill="#1E1B4B">es_transaction_tryout</text>
      <text x="10" y="62" font-size="10.5" font-weight="500" fill="#64748B">PK: (transaction_id, span_key, executed_order)</text>
      <text x="10" y="80" font-size="10" font-weight="400" fill="#7C3AED">&#x2022; Co-located Step Spans on Same Physical Node</text>
    </g>

    <!-- Bottom Benefit Tag -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="315" height="28" rx="6" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
      <text x="157" y="18" font-size="10.5" font-weight="600" fill="#5B21B6" text-anchor="middle">&#x2714; State Fetched On-Demand via transaction_id</text>
    </g>
  </g>
</svg>
