<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="100%" height="100%" style="background:#FAFBFD; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="glowGreen" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#059669" flood-opacity="0.12"/>
    </filter>
    <filter id="glowAmber" x="-4%" y="-6%" width="108%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#D97706" flood-opacity="0.14"/>
    </filter>

    <!-- Sleek, Sharp Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#10B981"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="tierCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="podBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <linearGradient id="workerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 22)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">Instance-Level Local Bucketing &amp; Autonomous Worker Re-Distribution</text>
    <text x="0" y="38" font-size="12" font-weight="400" fill="#64748B">Lock-free failure ingestion by ephemeral pods decoupled from deterministic consumption by retry workers</text>
  </g>

  <!-- ==================== STAGE 1: EPHEMERAL WRITER PODS ==================== -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="900" height="88" rx="8" fill="url(#podBg)" stroke="#FDE68A" stroke-width="1.4" filter="url(#cardShadow)"/>
    
    <!-- Badge 1 -->
    <circle cx="28" cy="28" r="14" fill="#D97706"/>
    <text x="28" y="32.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    
    <text x="52" y="26" font-size="13" font-weight="700" fill="#92400E">Thousands of Ephemeral Orchestrator Pods (Live Writers)</text>
    <text x="52" y="42" font-size="10.5" font-weight="500" fill="#B45309">Independent local JVM atomic counters • Zero cross-instance communication • No shared database locks</text>

    <!-- Pod A Box (x=58 on canvas -> x=18 relative to group) -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="265" height="30" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#10B981"/>
      <text x="26" y="19" font-size="11" font-weight="700" fill="#0F172A">pod-order-a</text>
      <text x="120" y="19" font-size="10" font-weight="500" fill="#92400E">AtomicCounter: 14,210</text>
    </g>

    <!-- Pod B Box (x=358 on canvas -> x=318 relative to group) -->
    <g transform="translate(318, 48)">
      <rect x="0" y="0" width="265" height="30" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="4" fill="#D97706"/>
      <text x="26" y="19" font-size="11" font-weight="700" fill="#0F172A">pod-order-b</text>
      <text x="108" y="19" font-size="10" font-weight="700" fill="#D97706">AtomicCounter: 70,586</text>
    </g>

    <!-- Pod C Box (x=658 on canvas -> x=618 relative to group) -->
    <g transform="translate(618, 48)">
      <rect x="0" y="0" width="265" height="30" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
      <circle cx="14" cy="15" r="4" fill="#10B981"/>
      <text x="26" y="19" font-size="11" font-weight="700" fill="#0F172A">pod-order-c</text>
      <text x="120" y="19" font-size="10" font-weight="500" fill="#92400E">AtomicCounter: 3,420</text>
    </g>
  </g>

  <!-- Downward Insertion Arrows: Pods to Tier 5 Partitions (Centered at 190, 490, 790) -->
  <line x1="190" y1="146" x2="190" y2="185" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <line x1="490" y1="146" x2="490" y2="185" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <line x1="790" y1="146" x2="790" y2="185" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- ==================== STAGE 2: ISOLATED CASSANDRA TIER 5 PARTITIONS ==================== -->
  <g transform="translate(40, 185)">
    <rect x="0" y="0" width="900" height="126" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 2 -->
    <circle cx="28" cy="26" r="14" fill="#2563EB"/>
    <text x="28" y="30.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

    <text x="52" y="24" font-size="13" font-weight="700" fill="#0F172A">Isolated Bounded Partitions (Cassandra Tier 5 Metadata Store)</text>
    <text x="52" y="40" font-size="10.5" font-weight="500" fill="#64748B">PK: ((region, cluster, service, date, window, instance_id, bucket_index), transaction_id)</text>

    <!-- Partition A (Single Bucket, x=58 on canvas -> x=18) -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="265" height="68" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#0F172A">Partition ((..., pod-order-a, 0))</text>
      <text x="12" y="38" font-size="9" font-weight="500" fill="#64748B">14,210 rows • Size: ~1.1MB (&lt; 5MB)</text>
      <rect x="12" y="46" width="85" height="15" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
      <text x="54" y="57" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">Bucket 0 Active</text>
    </g>

    <!-- Partition B (Two Buckets: 0 Sealed + 1 Rollover, x=358 on canvas -> x=318) -->
    <!-- Bucket 0 -->
    <g transform="translate(318, 48)">
      <rect x="0" y="0" width="265" height="32" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
      <text x="10" y="14" font-size="9.5" font-weight="700" fill="#0F172A">Partition ((..., pod-order-b, 0))</text>
      <text x="10" y="26" font-size="8.5" font-weight="500" fill="#475569">50,000 rows • Capped &amp; Sealed (~3.8MB)</text>
      <rect x="186" y="7" width="70" height="18" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8"/>
      <text x="221" y="19" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">Sealed (50k)</text>
    </g>

    <!-- Bucket 1 -->
    <g transform="translate(318, 84)">
      <rect x="0" y="0" width="265" height="32" rx="5" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="10" y="14" font-size="9.5" font-weight="700" fill="#92400E">Partition ((..., pod-order-b, 1))</text>
      <text x="10" y="26" font-size="8.5" font-weight="600" fill="#B45309">20,586 rows • Rollover Overflow (~1.6MB)</text>
      <rect x="186" y="7" width="70" height="18" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="0.8"/>
      <text x="221" y="19" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">Active (&lt; 50k)</text>
    </g>

    <!-- Partition C (Single Bucket, x=658 on canvas -> x=618) -->
    <g transform="translate(618, 48)">
      <rect x="0" y="0" width="265" height="68" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#0F172A">Partition ((..., pod-order-c, 0))</text>
      <text x="12" y="38" font-size="9" font-weight="500" fill="#64748B">3,420 rows • Size: ~300KB (&lt; 5MB)</text>
      <rect x="12" y="46" width="85" height="15" rx="3" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
      <text x="54" y="57" font-size="8" font-weight="600" fill="#065F46" text-anchor="middle">Bucket 0 Active</text>
    </g>
  </g>

  <!-- Downward Arrows: Tier 5 to Stage 3 (Centered at 190, 490, 790) -->
  <line x1="190" y1="301" x2="190" y2="340" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="490" y1="301" x2="490" y2="340" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="790" y1="301" x2="790" y2="340" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- ==================== STAGE 3: DETERMINISTIC SPATIAL MAPPING (Height=110) ==================== -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="900" height="110" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.4" filter="url(#cardShadow)"/>
    
    <!-- Badge 3 -->
    <circle cx="28" cy="24" r="14" fill="#2563EB"/>
    <text x="28" y="28.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- Stage 3 Header -->
    <text x="52" y="22" font-size="13" font-weight="700" fill="#1D4ED8">Deterministic Spatial Mapping (Tier 3: es_instances_by_retry_window)</text>
    <text x="52" y="37" font-size="10" font-weight="500" fill="#64748B">Cassandra CQL: instance_id_token = token(instance_id) • Uniform 64-bit Murmur3 Partition Space [-2⁶³ to 2⁶³-1]</text>

    <!-- Token Calculation Chips per Pod (y=56 relative to group -> y=396 on canvas) -->
    <!-- Pod A Token Chip (x=18) -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="265" height="34" rx="5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
      <text x="10" y="14" font-size="10" font-weight="700" fill="#1E40AF">token('pod-order-a')</text>
      <text x="10" y="27" font-size="9" font-weight="600" fill="#0F172A">= -4.81 × 10¹⁸ (Negative &lt; 0)</text>
    </g>

    <!-- Pod B Token Chip (x=318) -->
    <g transform="translate(318, 56)">
      <rect x="0" y="0" width="265" height="34" rx="5" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
      <text x="10" y="14" font-size="10" font-weight="700" fill="#92400E">token('pod-order-b')</text>
      <text x="10" y="27" font-size="9" font-weight="600" fill="#0F172A">= +3.19 × 10¹⁸ (Positive ≥ 0)</text>
    </g>

    <!-- Pod C Token Chip (x=618) -->
    <g transform="translate(618, 56)">
      <rect x="0" y="0" width="265" height="34" rx="5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
      <text x="10" y="14" font-size="10" font-weight="700" fill="#1E40AF">token('pod-order-c')</text>
      <text x="10" y="27" font-size="9" font-weight="600" fill="#0F172A">= -1.29 × 10¹⁸ (Negative &lt; 0)</text>
    </g>
  </g>

  <!-- ==================== STAGE 4 CONTAINER: RETRY-NODES & LEASE SPACE (Height=230, y=490) ==================== -->
  <g transform="translate(40, 490)">
    <rect x="0" y="0" width="900" height="230" rx="8" fill="#ECFDF5" stroke="#BFDBFE" stroke-width="1.4" filter="url(#cardShadow)"/>
  </g>

  <!-- ==================== ROUTING ARROWS: STAGE 3 CHIPS TO SECTORS (y=430 to y=512) ==================== -->
  <!-- Chip A (x=190, y=430) down to Sector 0 at (219, 512) -->
  <path d="M 190 430 L 190 470 L 219 470 L 219 510" fill="none" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Chip B (x=491, y=430) drops to 460, turns right to 711, down into Sector 1 at (711, 512) -->
  <path d="M 491 430 L 491 460 L 711 460 L 711 510" fill="none" stroke="#D97706" stroke-width="1.6" marker-end="url(#arrowAmber)"/>

  <!-- Chip C (x=791, y=430) drops to 475, turns left across boundary to 320, down into Sector 0 at (320, 512) -->
  <path d="M 791 430 L 791 475 L 320 475 L 320 510" fill="none" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- ==================== SECTOR LEASES (Inside Container at y=512) ==================== -->
  <!-- Sector 0 Lease Box (x=58, y=512, width=422, height=46) -->
  <g transform="translate(58, 512)">
    <rect x="0" y="0" width="422" height="46" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/>
    <rect x="8" y="6" width="90" height="17" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="53" y="18" font-size="8.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Sector 0 Lease</text>
    <text x="106" y="18" font-size="8.5" font-weight="600" fill="#1E40AF">Range: [-2⁶³ .. 0) • CQL: WHERE token &lt; 0</text>
    <circle cx="14" cy="33" r="3.5" fill="#3B82F6"/>
    <text x="24" y="36" font-size="8.5" font-weight="500" fill="#475569">Contains: <tspan font-weight="700" fill="#0F172A">pod-order-a</tspan> (-4.81×10¹⁸) &amp; <tspan font-weight="700" fill="#0F172A">pod-order-c</tspan> (-1.29×10¹⁸)</text>
  </g>

  <!-- Sector 1 Lease Box (x=500, y=512, width=422, height=46) -->
  <g transform="translate(500, 512)">
    <rect x="0" y="0" width="422" height="46" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
    <rect x="8" y="6" width="90" height="17" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
    <text x="53" y="18" font-size="8.5" font-weight="700" fill="#92400E" text-anchor="middle">Sector 1 Lease</text>
    <text x="106" y="18" font-size="8.5" font-weight="600" fill="#92400E">Range: [0 .. 2⁶³-1] • CQL: WHERE token ≥ 0</text>
    <circle cx="14" cy="33" r="3.5" fill="#D97706"/>
    <text x="24" y="36" font-size="8.5" font-weight="500" fill="#475569">Contains: <tspan font-weight="700" fill="#0F172A">pod-order-b</tspan> (+3.19×10¹⁸)</text>
  </g>

  <!-- Downward Arrows from Sectors to Workers -->
  <!-- Sector 0 Center (x=269) down to Worker 0 (y=558 to 574) -->
  <line x1="265" y1="558" x2="265" y2="572" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- Sector 1 Center (x=707) down to Worker 1 (y=558 to 574) -->
  <line x1="707" y1="558" x2="707" y2="572" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ==================== WORKER NODES (y=574) ==================== -->
  <!-- Worker Node 0 (x=60, y=574, width=410, height=74) -->
  <g transform="translate(60, 574)">
    <rect x="0" y="0" width="410" height="74" rx="8" fill="url(#workerBg)" stroke="#10B981" stroke-width="1.4" filter="url(#glowGreen)"/>
    
    <!-- Badge 4 -->
    <circle cx="26" cy="26" r="13" fill="#059669"/>
    <text x="26" y="30.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

    <text x="48" y="24" font-size="12.5" font-weight="700" fill="#065F46">Retry-Node 0 (Assigned Token Sector 0)</text>
    <text x="48" y="40" font-size="10" font-weight="500" fill="#047857">Autonomous discovery: Sweeps partitions of pod-order-a and pod-order-c</text>
    <text x="48" y="56" font-size="9.5" font-weight="700" fill="#065F46">• Re-executes transactions &amp; drops bucket partitions via O(1) tombstone</text>
  </g>

  <!-- Worker Node 1 (x=505, y=574, width=405, height=74) -->
  <g transform="translate(505, 574)">
    <rect x="0" y="0" width="405" height="74" rx="8" fill="url(#workerBg)" stroke="#10B981" stroke-width="1.4" filter="url(#glowGreen)"/>
    
    <!-- Badge 4 -->
    <circle cx="26" cy="26" r="13" fill="#059669"/>
    <text x="26" y="30.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

    <text x="48" y="24" font-size="12.5" font-weight="700" fill="#065F46">Retry-Node 1 (Assigned Token Sector 1)</text>
    <text x="48" y="40" font-size="10" font-weight="500" fill="#047857">Autonomous discovery: Sweeps pod-order-b (both bucket 0 &amp; bucket 1)</text>
    <text x="48" y="56" font-size="9.5" font-weight="700" fill="#065F46">• Re-executes transactions &amp; drops bucket partitions via O(1) tombstone</text>
  </g>

  <!-- ==================== BASE BANNER: BADGE 5 DECOUPLING (x=60, y=660, width=850, height=42) ==================== -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="850" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Badge 5 -->
    <circle cx="22" cy="21" r="11" fill="#2563EB"/>
    <text x="22" y="25" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>

    <text x="42" y="25" font-size="11" font-weight="700" fill="#0F172A">Ephemeral Lifecycle Decoupling:</text>
    <text x="240" y="25" font-size="10.5" font-weight="500" fill="#64748B">Even if ephemeral pods terminate or scale to 0 immediately after write, Retry-Nodes autonomously recover 100% of buckets.</text>
  </g>

</svg>
