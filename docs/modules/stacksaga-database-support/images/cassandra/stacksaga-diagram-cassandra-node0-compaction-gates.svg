<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a202c; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #2d3748; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1a202c; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4a5568; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #2b6cb0; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .badge-circle { fill: #2b6cb0; stroke: #ffffff; stroke-width: 1.5; }
      .badge-red { fill: #c53030; stroke: #ffffff; stroke-width: 1.5; }
      .badge-green { fill: #2f855a; stroke: #ffffff; stroke-width: 1.5; }
      .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #c53030; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead-red); }
      .arrow-green { stroke: #2f855a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
      .box-container { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 8; ry: 8; }
      .box-node { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.2; rx: 6; ry: 6; }
      .box-danger { fill: #fff5f5; stroke: #feb2b2; stroke-width: 1.2; rx: 6; ry: 6; }
      .box-gate { fill: #feebc8; stroke: #f6ad55; stroke-width: 1.2; rx: 6; ry: 6; }
      .box-success { fill: #f0fff4; stroke: #9ae6b4; stroke-width: 1.2; rx: 6; ry: 6; }
      .box-worker { fill: #ebf8ff; stroke: #63b3ed; stroke-width: 1.2; rx: 6; ry: 6; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5568" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c53030" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f855a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Top Container: The Premature Deletion Hazard -->
  <rect x="20" y="20" width="920" height="230" class="box-container" />
  <circle cx="40" cy="42" r="11" class="badge-red"/>
  <text x="40" y="42" class="badge-text">1</text>
  <text x="60" y="46" class="section-title">THE PROBLEM: PREMATURE DIRECTORY DELETION HAZARD (Without Node-0 Coordination)</text>

  <!-- Node 1: Fast Worker -->
  <g transform="translate(45, 65)">
    <rect width="250" height="100" class="box-worker" />
    <text x="15" y="25" class="node-text">Retry-Node 1 (Fast Worker)</text>
    <text x="15" y="45" class="sub-text">• Assigned lease: Sector 0</text>
    <text x="15" y="62" class="sub-text">• Has only 5 transactions in min 500</text>
    <text x="15" y="80" class="sub-text" fill="#2f855a">✓ Finishes in 100 milliseconds!</text>
  </g>

  <!-- Node 2: Slow Worker -->
  <g transform="translate(340, 65)">
    <rect width="250" height="100" class="box-worker" />
    <text x="15" y="25" class="node-text">Retry-Node 2 (Heavy Worker)</text>
    <text x="15" y="45" class="sub-text">• Assigned lease: Sector 1</text>
    <text x="15" y="62" class="sub-text">• Has 40,000 transactions in min 500</text>
    <text x="15" y="80" class="sub-text" fill="#c05621">⏳ Still processing (takes 35 seconds)</text>
  </g>

  <!-- Danger Arrow -->
  <path d="M 295 115 L 340 115" class="arrow" />

  <!-- Hazard Box -->
  <g transform="translate(625, 65)">
    <rect width="295" height="170" class="box-danger" />
    <circle cx="20" cy="20" r="11" class="badge-red"/>
    <text x="20" y="20" class="badge-text">2</text>
    <text x="40" y="24" class="node-text" fill="#742a2a">THE PREMATURE DELETION TRAP</text>
    <text x="15" y="50" class="sub-text">If Node-1 was allowed to delete window 500</text>
    <text x="15" y="66" class="sub-text">from Tier 2 (`es_recovery_windows_by_day`):</text>
    <text x="15" y="90" class="sub-text" font-weight="bold" fill="#c53030">• Minute 500 disappears from directory.</text>
    <text x="15" y="108" class="sub-text" font-weight="bold" fill="#c53030">• If Node-2 restarts now, it re-queries Tier 2.</text>
    <text x="15" y="126" class="sub-text" font-weight="bold" fill="#c53030">• Window 500 is missing!</text>
    <text x="15" y="148" class="sub-text" font-weight="bold" fill="#742a2a">❌ 40,000 transactions orphaned &amp; lost!</text>
  </g>

  <!-- Worker Rule Note inside Top Box -->
  <g transform="translate(45, 180)">
    <rect width="545" height="55" class="box-node" />
    <text x="15" y="22" class="node-text">Rule: Workers Only Delete Local Data</text>
    <text x="15" y="42" class="sub-text">
      Workers (Node-1, Node-2) drop ONLY their own Tier 5 bucket partitions and their own Tier 3 instance markers.
    </text>
  </g>

  <!-- Bottom Container: Node-0 Compaction Protocol -->
  <rect x="20" y="270" width="920" height="330" class="box-container" />
  <circle cx="40" cy="292" r="11" class="badge-green"/>
  <text x="40" y="292" class="badge-text">3</text>
  <text x="60" y="296" class="section-title">THE SOLUTION: NODE-0 COMPACTOR OVERSEER TWO-GATE VERIFICATION PROTOCOL</text>

  <!-- Node-0 Identity Box -->
  <g transform="translate(45, 320)">
    <rect width="210" height="260" class="box-worker" />
    <circle cx="20" cy="20" r="11" class="badge-circle"/>
    <text x="20" y="20" class="badge-text">3</text>
    <text x="40" y="24" class="node-text">Node-0 Overseer</text>
    <text x="15" y="50" class="sub-text">• Not a separate binary</text>
    <text x="15" y="68" class="sub-text">• Holds lowest token lease</text>
    <text x="15" y="86" class="sub-text">• Sole authority to delete</text>
    <text x="15" y="104" class="sub-text">  shared upper directory:</text>
    <text x="25" y="122" class="code-text">• Tier 2 (Minute Windows)</text>
    <text x="25" y="140" class="code-text">• Tier 1 (Calendar Dates)</text>
    <text x="15" y="170" class="sub-text">Must pass TWO GATES</text>
    <text x="15" y="188" class="sub-text">before issuing any</text>
    <text x="15" y="206" class="sub-text">directory deletion.</text>
    <text x="15" y="235" class="sub-text" font-weight="bold" fill="#2b6cb0">✓ Zero Distributed Locks</text>
  </g>

  <!-- Arrow to Gate 1 -->
  <path d="M 255 450 L 295 450" class="arrow" />

  <!-- Gate 1 Box -->
  <g transform="translate(305, 320)">
    <rect width="280" height="120" class="box-gate" />
    <circle cx="20" cy="20" r="11" class="badge-circle"/>
    <text x="20" y="20" class="badge-text">4</text>
    <text x="40" y="24" class="node-text">GATE 1: Cluster-Wide Completion</text>
    <text x="15" y="48" class="sub-text">• Queries Tier 3 without token filter:</text>
    <text x="15" y="65" class="code-text">SELECT instance_id FROM es_instances_...</text>
    <text x="15" y="80" class="code-text">WHERE date = :d AND minute = :w</text>
    <text x="15" y="102" class="sub-text" font-weight="bold" fill="#2f855a">
      ✓ MUST RETURN 0 ROWS across entire cluster
    </text>
  </g>

  <!-- Arrow Gate 1 -> Gate 2 -->
  <path d="M 445 440 L 445 465" class="arrow" />

  <!-- Gate 2 Box -->
  <g transform="translate(305, 465)">
    <rect width="280" height="115" class="box-gate" />
    <circle cx="20" cy="20" r="11" class="badge-circle"/>
    <text x="20" y="20" class="badge-text">5</text>
    <text x="40" y="24" class="node-text">GATE 2: Wall-Clock Time Barrier</text>
    <text x="15" y="48" class="sub-text">• Verifies current UTC time:</text>
    <text x="15" y="66" class="code-text">UTC_NOW &gt; Window_End_Time + buffer</text>
    <text x="15" y="88" class="sub-text">Guarantees live Standard-Nodes have</text>
    <text x="15" y="104" class="sub-text">fully advanced to W+1 (no late writes)</text>
  </g>

  <!-- Arrow to Safe Pruning Box -->
  <path d="M 585 450 L 635 450" class="arrow-green" />

  <!-- Safe Pruning Box -->
  <g transform="translate(645, 320)">
    <rect width="275" height="260" class="box-success" />
    <circle cx="20" cy="20" r="11" class="badge-green"/>
    <text x="20" y="20" class="badge-text">6</text>
    <text x="40" y="24" class="node-text" fill="#22543d">SAFE UPPER PRUNING</text>
    <text x="15" y="52" class="sub-text" font-weight="bold">Both Gates Passed!</text>
    <text x="15" y="75" class="sub-text">1. Delete minute window from Tier 2:</text>
    <text x="15" y="92" class="code-text">DELETE FROM es_recovery_windows_by_day</text>
    <text x="15" y="106" class="code-text">WHERE date = :d AND minute = :w;</text>
    
    <text x="15" y="135" class="sub-text">2. Check if all 1440 windows in day done.</text>
    <text x="15" y="152" class="sub-text">If yes, delete active date from Tier 1:</text>
    <text x="15" y="169" class="code-text">DELETE FROM es_days_by_year</text>
    <text x="15" y="183" class="code-text">WHERE year = :y AND date = :d;</text>

    <text x="15" y="215" class="sub-text" font-weight="bold" fill="#22543d">
      ✓ ZERO PREMATURE DELETIONS
    </text>
    <text x="15" y="235" class="sub-text" font-weight="bold" fill="#22543d">
      ✓ ZERO ORPHANED TRANSACTIONS
    </text>
  </g>
</svg>
