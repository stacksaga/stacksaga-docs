<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="100%" height="100%" style="background:#FAFBFD; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Sleek, Sharp Arrow Markers (Compact, orient=auto) -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#8B5CF6"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="tierCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">Murmur3 Token Ring Slicing &amp; Spatial Worker Isolation</text>
    <text x="0" y="38" font-size="12" font-weight="400" fill="#64748B">Deterministic token range leasing enabling lock-free parallel traversal across workers</text>
  </g>

  <!-- ==================== TOP: RING COORDINATOR ==================== -->
  <g transform="translate(290, 52)">
    <rect x="0" y="0" width="400" height="54" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 2 -->
    <circle cx="26" cy="27" r="14" fill="#2563EB"/>
    <text x="26" y="32" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

    <!-- Coordinator Info -->
    <text x="48" y="23" font-size="12.5" font-weight="700" fill="#0F172A">Ring Coordinator</text>
    <text x="48" y="38" font-size="10.5" font-weight="500" fill="#64748B">RSocket non-overlapping lease assignment</text>

    <!-- Badge 5: Lease Guard -->
    <rect x="258" y="10" width="132" height="34" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="272" cy="27" r="9" fill="#D97706"/>
    <text x="272" y="30.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="286" y="23" font-size="10" font-weight="700" fill="#92400E">Lease Guard</text>
    <text x="286" y="35" font-size="8.5" font-weight="500" fill="#B45309">valid_from .. to (ms)</text>
  </g>

  <!-- Coordinator Arrow to Ring (Vertical center line at X=490) -->
  <line x1="490" y1="106" x2="490" y2="123" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- ==================== LEFT: APPLICATION PODS ==================== -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="195" height="210" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 3 -->
    <circle cx="26" cy="26" r="14" fill="#2563EB"/>
    <text x="26" y="31" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <text x="48" y="24" font-size="13" font-weight="700" fill="#0F172A">Application Pods</text>
    <text x="48" y="38" font-size="10.5" font-weight="500" fill="#64748B">Deterministic routing</text>

    <!-- Pod 1 -->
    <rect x="14" y="52" width="167" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="69" font-size="11" font-weight="600" fill="#0F172A">pod-order-1</text>
    <text x="24" y="80" font-size="8.5" font-weight="500" fill="#94A3B8">instance_id</text>

    <!-- Pod 2 -->
    <rect x="14" y="98" width="167" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="115" font-size="11" font-weight="600" fill="#0F172A">pod-payment-a</text>
    <text x="24" y="126" font-size="8.5" font-weight="500" fill="#94A3B8">instance_id</text>

    <!-- Pod 3 -->
    <rect x="14" y="144" width="167" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="24" y="161" font-size="11" font-weight="600" fill="#0F172A">pod-inventory-3</text>
    <text x="24" y="172" font-size="8.5" font-weight="500" fill="#94A3B8">instance_id</text>
  </g>

  <!-- Clean Single Horizontal Arrow: From Pods Card (X=235) to Hash Box (X=265) -->
  <line x1="235" y1="230" x2="263" y2="230" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Hash Box (Centered on Y=230) -->
  <g transform="translate(265, 205)">
    <rect x="0" y="0" width="105" height="50" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="52.5" y="21" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">token(instance_id)</text>
    <text x="52.5" y="37" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Murmur3 Hash</text>
  </g>

  <!-- Clean Single Horizontal Arrow: From Hash Box (X=370) to Ring Perimeter (X=385) -->
  <line x1="370" y1="230" x2="383" y2="230" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- ==================== CENTER: MURMUR3 TOKEN RING (Centered at 490, 230) ==================== -->
  <g transform="translate(490, 230)">
    <!-- Sector 0: Left Sector (Blue, 150 deg to 270 deg) -->
    <path d="M -91 52.5 A 105 105 0 0 1 0 -105 L 0 -65 A 65 65 0 0 0 -56.3 32.5 Z" fill="#3B82F6" stroke="#FAFBFD" stroke-width="3"/>

    <!-- Sector 1: Bottom Sector (Emerald, 30 deg to 150 deg) -->
    <path d="M 91 52.5 A 105 105 0 0 1 -91 52.5 L -56.3 32.5 A 65 65 0 0 0 56.3 32.5 Z" fill="#10B981" stroke="#FAFBFD" stroke-width="3"/>

    <!-- Sector 2: Right Sector (Purple, 270 deg to 390 deg) -->
    <path d="M 0 -105 A 105 105 0 0 1 91 52.5 L 56.3 32.5 A 65 65 0 0 0 0 -65 Z" fill="#8B5CF6" stroke="#FAFBFD" stroke-width="3"/>

    <!-- Inner Donut Hole -->
    <circle cx="0" cy="0" r="62" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Badge 1 at Center -->
    <circle cx="0" cy="-18" r="13" fill="#2563EB"/>
    <text x="0" y="-13.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    
    <text x="0" y="8" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Murmur3 Ring</text>
    <text x="0" y="22" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">-2⁶³ to 2⁶³-1</text>

    <!-- Sector Labels on Ring -->
    <text x="-65" y="-15" font-size="9" font-weight="700" fill="#1E40AF">Sector 0</text>
    <text x="0" y="90" font-size="9" font-weight="700" fill="#065F46" text-anchor="middle">Sector 1</text>
    <text x="65" y="-15" font-size="9" font-weight="700" fill="#5B21B6" text-anchor="end">Sector 2</text>
  </g>

  <!-- ==================== CONNECTING ARROWS TO WORKERS (Completely Unobstructed) ==================== -->
  <!-- Left Arrow (Sector 0 -> Worker 0) -->
  <path d="M 399 283 C 399 350, 177 350, 177 393" fill="none" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Center Arrow (Sector 1 -> Worker 1, purely vertical) -->
  <line x1="490" y1="335" x2="490" y2="393" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Right Arrow (Sector 2 -> Worker 2) -->
  <path d="M 581 283 C 581 350, 803 350, 803 393" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- ==================== BOTTOM: 3 SYMMETRIC WORKER CARDS ==================== -->

  <!-- Worker Card 0 (Blue, Center at X=177) -->
  <g transform="translate(42, 395)">
    <rect x="0" y="0" width="270" height="74" rx="8" fill="url(#tierCardBg)" stroke="#3B82F6" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#1E40AF">Retry Worker Node-0</text>
    
    <rect x="164" y="10" width="92" height="18" rx="9" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="210" y="22.5" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Lease: Sector 0</text>

    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#0F172A">WHERE instance_id_token IN Sector 0</text>
    <text x="14" y="58" font-size="9" font-weight="500" fill="#64748B">Queries only owned token bounds</text>
  </g>

  <!-- Worker Card 1 (Emerald, Center at X=490) -->
  <g transform="translate(355, 395)">
    <rect x="0" y="0" width="270" height="74" rx="8" fill="url(#tierCardBg)" stroke="#10B981" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#065F46">Retry Worker Node-1</text>

    <rect x="164" y="10" width="92" height="18" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="210" y="22.5" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">Lease: Sector 1</text>

    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#0F172A">WHERE instance_id_token IN Sector 1</text>
    <text x="14" y="58" font-size="9" font-weight="500" fill="#64748B">Queries only owned token bounds</text>
  </g>

  <!-- Worker Card 2 (Purple, Center at X=803) -->
  <g transform="translate(668, 395)">
    <rect x="0" y="0" width="270" height="74" rx="8" fill="url(#tierCardBg)" stroke="#8B5CF6" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#5B21B6">Retry Worker Node-2</text>

    <rect x="164" y="10" width="92" height="18" rx="9" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="210" y="22.5" font-size="8.5" font-weight="700" fill="#5B21B6" text-anchor="middle">Lease: Sector 2</text>

    <text x="14" y="44" font-size="9.5" font-weight="600" fill="#0F172A">WHERE instance_id_token IN Sector 2</text>
    <text x="14" y="58" font-size="9" font-weight="500" fill="#64748B">Queries only owned token bounds</text>
  </g>

  <!-- ==================== BASE BANNER: BADGE 4 (SPATIAL ISOLATION) ==================== -->
  <g transform="translate(340, 482)">
    <rect x="0" y="0" width="300" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="15" cy="13" r="9" fill="#2563EB"/>
    <text x="15" y="16.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="165" y="17" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">Spatial Isolation: Zero Lock Contention</text>
  </g>

</svg>
