<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" style="background:#FAFBFD; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Sleek, Sharp Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#10B981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#8B5CF6"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="tierCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 24)">
    <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">Top-Down Traversal &amp; Compaction Lifecycle Pipeline</text>
    <text x="0" y="38" font-size="12" font-weight="400" fill="#64748B">Sequential lifecycle from error ingestion and worker discovery to execution and directory compaction</text>
  </g>

  <!-- Horizontal Pipeline Connecting Arrows between Column Headers -->
  <line x1="252" y1="98" x2="268" y2="98" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <line x1="482" y1="98" x2="498" y2="98" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <line x1="712" y1="98" x2="728" y2="98" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ==================== COLUMN 1: INGESTION (AMBER) ==================== -->
  <!-- Column Header -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#92400E">1. Ingestion (Pods)</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Target Window W+1</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Failure targets next window</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#D97706">Write-ahead bypass</text>
  </g>
  <!-- Arrow 1 -> 2 -->
  <line x1="145" y1="204" x2="145" y2="220" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- Step 2 -->
  <g transform="translate(40, 222)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Atomic Counter Check</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Local JVM rollover (&lt; 50k)</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#D97706">Selects bucket_index</text>
  </g>
  <!-- Arrow 2 -> 3 -->
  <line x1="145" y1="296" x2="145" y2="312" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- Step 3 -->
  <g transform="translate(40, 314)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Path &amp; Metadata Insert</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Tiers 1-4 directory paths</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#D97706">Appends pointer to Tier 5</text>
  </g>

  <!-- ==================== COLUMN 2: TRAVERSAL (BLUE) ==================== -->
  <!-- Column Header -->
  <g transform="translate(270, 80)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#1E40AF">2. Traversal (Workers)</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(270, 130)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Token Lease &amp; Guard</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Acquires token bounds</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#2563EB">Heartbeat validity check</text>
  </g>
  <!-- Arrow 4 -> 5 -->
  <line x1="375" y1="204" x2="375" y2="220" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Step 5 -->
  <g transform="translate(270, 222)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Top-Down Discovery</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Scans Tier 1 → Tier 2</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#2563EB">Filters Tier 3 token range</text>
  </g>
  <!-- Arrow 5 -> 6 -->
  <line x1="375" y1="296" x2="375" y2="312" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Step 6 -->
  <g transform="translate(270, 314)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Metadata Streaming</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Discovers Tier 4 buckets</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#2563EB">Streams Tier 5 records</text>
  </g>

  <!-- ==================== COLUMN 3: EXECUTION & DROP (EMERALD) ==================== -->
  <!-- Column Header -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#065F46">3. Execution &amp; Drop</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(500, 130)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Concurrent Re-Invoke</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Lazy fetch es_transaction</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#059669">Controlled concurrency</text>
  </g>
  <!-- Arrow 7 -> 8 -->
  <line x1="605" y1="204" x2="605" y2="220" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Step 8 -->
  <g transform="translate(500, 222)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Bucket Partition Drop</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">Tier 5 partition deleted</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#059669">O(1) single tombstone</text>
  </g>
  <!-- Arrow 8 -> 9 -->
  <line x1="605" y1="296" x2="605" y2="312" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Step 9 -->
  <g transform="translate(500, 314)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="22" cy="24" r="11" fill="#2563EB"/>
    <text x="22" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
    <text x="40" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Instance Marker Delete</text>
    <text x="12" y="46" font-size="9.5" font-weight="500" fill="#64748B">All buckets completed</text>
    <text x="12" y="60" font-size="9" font-weight="600" fill="#059669">Removes Tier 3 marker</text>
  </g>

  <!-- ==================== COLUMN 4: NODE-0 OVERSEER (PURPLE) ==================== -->
  <!-- Column Header -->
  <g transform="translate(730, 80)">
    <rect x="0" y="0" width="210" height="36" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#5B21B6">4. Node-0 Overseer</text>
  </g>

  <!-- Step 10 -->
  <g transform="translate(730, 130)">
    <rect x="0" y="0" width="210" height="118" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="24" r="11" fill="#2563EB"/>
    <text x="25" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
    <text x="44" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Gate 1 &amp; 2 Verification</text>
    <text x="14" y="52" font-size="9.5" font-weight="600" fill="#5B21B6">• Gate 1: Cluster Scan</text>
    <text x="24" y="66" font-size="9" font-weight="500" fill="#64748B">Zero instances in Tier 3</text>
    <text x="14" y="86" font-size="9.5" font-weight="600" fill="#5B21B6">• Gate 2: Time Elapsed</text>
    <text x="24" y="100" font-size="9" font-weight="500" fill="#64748B">Window passed into history</text>
  </g>
  <!-- Arrow 10 -> 11 -->
  <line x1="835" y1="248" x2="835" y2="268" stroke="#CBD5E1" stroke-width="1.8" marker-end="url(#arrowPurple)"/>

  <!-- Step 11 -->
  <g transform="translate(730, 270)">
    <rect x="0" y="0" width="210" height="118" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="24" r="11" fill="#2563EB"/>
    <text x="25" y="28" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
    <text x="44" y="26" font-size="11.5" font-weight="700" fill="#0F172A">Directory Compaction</text>
    <text x="14" y="52" font-size="9.5" font-weight="600" fill="#5B21B6">• Tier 2 Minute Window</text>
    <text x="24" y="66" font-size="9" font-weight="500" fill="#64748B">Deletes window record</text>
    <text x="14" y="86" font-size="9.5" font-weight="600" fill="#5B21B6">• Tier 1 Calendar Date</text>
    <text x="24" y="100" font-size="9" font-weight="500" fill="#64748B">Deletes date when empty</text>
  </g>

  <!-- ==================== BASE BANNER: LIFECYCLE INVARIANT ==================== -->
  <g transform="translate(40, 412)">
    <rect x="0" y="0" width="900" height="62" rx="8" fill="url(#tierCardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <circle cx="30" cy="31" r="14" fill="#059669"/>
    <!-- Checkmark Icon -->
    <path d="M 23 31 L 28 36 L 38 26" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="56" y="26" font-size="12" font-weight="700" fill="#0F172A">Complete Lifecycle Invariant: Zero Phantom Reads &amp; Zero Tombstone Leakage</text>
    <text x="56" y="44" font-size="10" font-weight="500" fill="#64748B">Write-ahead to W+1 isolates readers • O(1) partition deletions prevent tombstone accumulation • Node-0 ensures clean tree pruning</text>
  </g>

</svg>
