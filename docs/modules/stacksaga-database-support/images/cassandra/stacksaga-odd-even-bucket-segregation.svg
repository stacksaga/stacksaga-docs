<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960px" height="430px" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .canvas-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .canvas-sub { font-size: 11px; fill: #64748b; }
      .box-container { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 4,4; rx: 8; }
      .group-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .group-sub { font-size: 10px; fill: #64748b; }
      .sub-title { font-size: 12px; font-weight: 700; }
      .badge-text { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .mono-code { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; }
      .chip-text { font-size: 9.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    </style>

    <!-- Arrowhead Markers -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 22)">
    <text x="0" y="16" class="canvas-title">Odd vs. Even Bucket Segregation &amp; Tombstone Isolation</text>
    <text x="0" y="34" class="canvas-sub">Dual in-memory atomic counters isolate pure retry reads from high-frequency watchdog tombstones</text>
  </g>

  <!-- ==================== LEFT: POD JVM MEMORY ==================== -->
  <g transform="translate(40, 65)">
    <!-- Container Box -->
    <rect width="310" height="345" class="box-container"/>
    
    <!-- Stage 1 Badge & Header -->
    <circle cx="24" cy="24" r="12" fill="#2563eb"/>
    <text x="24" y="24" class="badge-text">1</text>
    <text x="46" y="22" class="group-title">Standard-Node JVM Memory</text>
    <text x="46" y="36" class="group-sub">Local atomic counters • Zero database locks</text>

    <!-- Sub-box 1: Even Bucket Counter (Retry) -->
    <g transform="translate(16, 55)">
      <rect width="278" height="130" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="22" class="sub-title" fill="#065f46">retryCounter : AtomicLong</text>
      <text x="16" y="38" font-size="10" font-weight="500" fill="#047857">• Incremented ONLY on transient step failure</text>
      
      <rect x="16" y="48" width="246" height="24" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <text x="26" y="64" class="mono-code" fill="#065f46">Formula: (slot / 50K) * 2</text>
      
      <rect x="16" y="78" width="246" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="26" y="95" font-size="10.5" font-weight="700" fill="#166534">EVEN BUCKETS: 0, 2, 4, 6 ...</text>
      
      <text x="16" y="118" font-size="9.5" font-weight="600" fill="#15803d">Target: Immediate Write Window (W+1)</text>
    </g>

    <!-- Sub-box 2: Odd Bucket Counter (Restore Watchdog) -->
    <g transform="translate(16, 197)">
      <rect width="278" height="130" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
      <text x="16" y="22" class="sub-title" fill="#5b21b6">restoreCounter : AtomicLong</text>
      <text x="16" y="38" font-size="10" font-weight="500" fill="#6d28d9">• Incremented on EVERY transaction start</text>
      
      <rect x="16" y="48" width="246" height="24" rx="4" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="26" y="64" class="mono-code" fill="#5b21b6">Formula: (slot / 50K) * 2 + 1</text>
      
      <rect x="16" y="78" width="246" height="26" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
      <text x="26" y="95" font-size="10.5" font-weight="700" fill="#4c1d95">ODD BUCKETS: 1, 3, 5, 7 ...</text>
      
      <text x="16" y="118" font-size="9.5" font-weight="600" fill="#6d28d9">Target: Far-Future Watchdog Window (W+K)</text>
    </g>
  </g>

  <!-- ==================== MIDDLE CONNECTING ARROWS ==================== -->
  <line x1="334" y1="185" x2="385" y2="185" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="334" y1="327" x2="385" y2="327" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ==================== RIGHT: CASSANDRA TIER 5 STORAGE ISOLATION ==================== -->
  <g transform="translate(385, 65)">
    <!-- Container Box -->
    <rect width="535" height="345" class="box-container"/>
    
    <!-- Header -->
    <text x="20" y="24" class="group-title">Tier 5 Storage Isolation (es_recovery_transactions_by_instance)</text>
    <text x="20" y="38" class="group-sub">Composite Partition Key: ((region, cluster, service, date, window, instance_id, bucket_index))</text>

    <!-- Lane 1: Even Buckets (Pure Retry) -->
    <g transform="translate(15, 55)">
      <rect width="505" height="130" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      
      <!-- Lane 1 Header -->
      <circle cx="20" cy="20" r="11" fill="#059669"/>
      <text x="20" y="20" class="badge-text">2</text>
      <text x="38" y="24" class="sub-title" fill="#065f46">EVEN BUCKETS (0, 2, 4...) — Pure Retry Lane</text>
      
      <rect x="375" y="10" width="118" height="20" rx="10" fill="#dcfce7" stroke="#86efac"/>
      <text x="434" y="23.5" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">✓ 0% Tombstones</text>

      <!-- Row Representation Chips -->
      <g transform="translate(16, 42)">
        <!-- Chip 1 -->
        <rect x="0" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
        <text x="60" y="13.5" class="chip-text" fill="#166534">tx-101 [LIVE]</text>

        <!-- Chip 2 -->
        <rect x="120" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <circle cx="132" cy="13" r="3.5" fill="#10b981"/>
        <text x="180" y="13.5" class="chip-text" fill="#166534">tx-102 [LIVE]</text>

        <!-- Chip 3 -->
        <rect x="240" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <circle cx="252" cy="13" r="3.5" fill="#10b981"/>
        <text x="300" y="13.5" class="chip-text" fill="#166534">tx-103 [LIVE]</text>

        <!-- Chip 4 -->
        <rect x="360" y="0" width="113" height="26" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <circle cx="372" cy="13" r="3.5" fill="#10b981"/>
        <text x="422" y="13.5" class="chip-text" fill="#166534">tx-104 [LIVE]</text>
      </g>

      <!-- Bottom Note & Badge 4 -->
      <g transform="translate(16, 92)">
        <circle cx="10" cy="10" r="9" fill="#2563eb"/>
        <text x="10" y="10" class="badge-text" font-size="9">4</text>
        <text x="26" y="14" font-size="10" font-weight="700" fill="#1e40af">Single O(1) Partition Tombstone:</text>
        <text x="198" y="14" font-size="9.5" fill="#475569">Dropped entirely on completion • Workers never scan dead rows</text>
      </g>
    </g>

    <!-- Lane 2: Odd Buckets (Restore Watchdogs) -->
    <g transform="translate(15, 197)">
      <rect width="505" height="130" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
      
      <!-- Lane 2 Header -->
      <circle cx="20" cy="20" r="11" fill="#7c3aed"/>
      <text x="20" y="20" class="badge-text">3</text>
      <text x="38" y="24" class="sub-title" fill="#5b21b6">ODD BUCKETS (1, 3, 5...) — Restore Watchdog Lane</text>
      
      <rect x="345" y="10" width="148" height="20" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="419" y="23.5" font-size="9" font-weight="700" fill="#b91c1c" text-anchor="middle">⚠ Quarantines Tombstones</text>

      <!-- Row Representation Chips -->
      <g transform="translate(16, 42)">
        <!-- Chip 1 (Deleted) -->
        <rect x="0" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="3,2"/>
        <circle cx="12" cy="13" r="3.5" fill="#ef4444"/>
        <text x="60" y="13.5" class="chip-text" fill="#991b1b">tx-001 [DEL]</text>

        <!-- Chip 2 (Deleted) -->
        <rect x="120" y="0" width="110" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="3,2"/>
        <circle cx="132" cy="13" r="3.5" fill="#ef4444"/>
        <text x="180" y="13.5" class="chip-text" fill="#991b1b">tx-002 [DEL]</text>

        <!-- Chip 3 (Crashed / Survives) -->
        <rect x="240" y="0" width="110" height="26" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
        <circle cx="252" cy="13" r="3.5" fill="#d97706"/>
        <text x="302" y="13.5" class="chip-text" fill="#92400e" font-weight="700">tx-003 [CRASH]</text>

        <!-- Chip 4 (Deleted) -->
        <rect x="360" y="0" width="113" height="26" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-dasharray="3,2"/>
        <circle cx="372" cy="13" r="3.5" fill="#ef4444"/>
        <text x="422" y="13.5" class="chip-text" fill="#991b1b">tx-004 [DEL]</text>
      </g>

      <!-- Bottom Explanation -->
      <g transform="translate(16, 92)">
        <text x="0" y="14" font-size="10" font-weight="700" fill="#5b21b6">Tombstone Quarantine:</text>
        <text x="130" y="14" font-size="9.5" fill="#475569">High-frequency deletes stay isolated; eliminates ReadFailureException</text>
      </g>
    </g>
  </g>
</svg>
