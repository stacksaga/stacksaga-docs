<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 770" width="980px" height="770px" style="background-color: #ffffff; color-scheme: light;">
  
  <defs>
    <style>
      .canvas-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .subtext-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; }
      .code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 10px; fill: #0369a1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      
      .box-container { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 8; }
      .box-white { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; rx: 6; }
      .box-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.2; rx: 6; }
      .box-emerald { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.2; rx: 6; }
      .box-purple { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.2; rx: 6; }
      .box-rose { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.2; rx: 6; }
      
      .badge-blue { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }
      .badge-emerald { fill: #16a34a; stroke: #ffffff; stroke-width: 1.5; }
      .badge-amber { fill: #d97706; stroke: #ffffff; stroke-width: 1.5; }
      .badge-purple { fill: #7c3aed; stroke: #ffffff; stroke-width: 1.5; }
      .badge-rose { fill: #dc2626; stroke: #ffffff; stroke-width: 1.5; }
      
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #2563eb; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-emerald { stroke: #16a34a; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-emerald); }
      .arrow-rose { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arrowhead-rose); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-emerald" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#16a34a" />
    </marker>
    <marker id="arrowhead-rose" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#dc2626" />
    </marker>
  </defs>

  <rect fill="#ffffff" width="980px" height="770px" x="0" y="0"/>

  <!-- 1. REGION CONTAINER: us-central-region -->
  <g id="region_container">
    <rect x="20" y="15" width="940" height="540" rx="16" ry="16" fill="none" stroke="#82b366" stroke-dasharray="4 4" stroke-width="2"/>
    <text x="490" y="38" fill="#0f172a" font-size="14px" font-weight="bold" text-anchor="middle">us-central-region</text>
    <text x="490" y="54" fill="#555555" font-size="11px" text-anchor="middle">Domain: Order-Service (Horizontal Scaling via Virtual Clusters &amp; Regional Cell Isolation)</text>
  </g>

  <!-- 2. VIRTUAL CLUSTER 1 -->
  <g id="virtual_cluster_1">
    <rect x="35" y="70" width="435" height="470" rx="14" ry="14" fill="none" stroke="#9673a6" stroke-dasharray="4 4" stroke-width="1.8"/>
    <circle cx="56" cy="94" r="11" class="badge-purple"/>
    <text x="56" y="94" class="badge-text">1</text>
    <text x="76" y="98" fill="#4a148c" font-size="13px" font-weight="bold">Order-Service • Virtual Cluster 1</text>
    <text x="76" y="112" fill="#666666" font-size="10px">stacksaga.instance.cluster = us-central-cluster-1</text>

    <!-- Ring-Coordinator Container -->
    <g id="vc1_coordinator">
      <rect x="48" y="122" width="410" height="138" rx="10" ry="10" fill="none" stroke="#10739e" stroke-dasharray="3 3" stroke-width="1.4"/>
      <circle cx="68" cy="140" r="10" class="badge-blue"/>
      <text x="68" y="140" class="badge-text" font-size="10px">3</text>
      <text x="253" y="143" fill="#10739e" font-size="11.5px" font-weight="bold" text-anchor="middle">Order-Service-Ring-Coordinator (cluster-1)</text>

      <rect x="62" y="160" width="75" height="44" rx="6" ry="6" fill="#fad9d5" stroke="#ae4132" stroke-width="1.3"/>
      <text x="99.5" y="186" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Master</text>

      <rect x="220" y="156" width="140" height="42" rx="6" ry="6" fill="#ffcc99" stroke="#36393d" stroke-width="1.3"/>
      <text x="290" y="181" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Slave-1</text>

      <rect x="220" y="208" width="140" height="42" rx="6" ry="6" fill="#ffcc99" stroke="#36393d" stroke-width="1.3"/>
      <text x="290" y="233" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Slave-N</text>

      <path d="M 137 177 L 214 177" fill="none" stroke="#36393d" stroke-dasharray="3 3" stroke-width="1.2" marker-end="url(#arrowhead)"/>
      <path d="M 100 204 L 100 229 L 214 229" fill="none" stroke="#36393d" stroke-dasharray="3 3" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    </g>

    <!-- Nodes Container -->
    <g id="vc1_nodes">
      <rect x="48" y="270" width="410" height="258" rx="10" ry="10" fill="none" stroke="#9673a6" stroke-dasharray="3 3" stroke-width="1.4"/>
      <text x="253" y="288" fill="#4a148c" font-size="11.5px" font-weight="bold" text-anchor="middle">Order-Service Orchestrator Pods (cluster-1)</text>

      <!-- Standard-Nodes Container -->
      <rect x="58" y="298" width="180" height="218" rx="8" ry="8" fill="none" stroke="#56517e" stroke-dasharray="3 3" stroke-width="1.2"/>
      <circle cx="76" cy="316" r="10" class="badge-blue"/>
      <text x="76" y="316" class="badge-text" font-size="10px">2</text>
      <text x="156" y="316" fill="#56517e" font-size="10.5px" font-weight="bold" text-anchor="middle">Standard-Nodes (~9k)</text>
      <text x="148" y="331" fill="#666666" font-size="8.5px" text-anchor="middle">Live Traffic • Writes Ahead (W+1)</text>

      <rect x="68" y="344" width="160" height="44" rx="6" ry="6" fill="#d0cee2" stroke="#56517e" stroke-width="1.2"/>
      <text x="148" y="363" fill="#000000" font-size="10px" text-anchor="middle">order-service</text>
      <text x="148" y="377" fill="#000000" font-size="10.5px" font-weight="bold" text-anchor="middle">pod-order-1 (Writer)</text>

      <circle cx="148" cy="408" r="2.5" fill="#56517e"/>
      <circle cx="148" cy="418" r="2.5" fill="#56517e"/>
      <circle cx="148" cy="428" r="2.5" fill="#56517e"/>

      <rect x="68" y="445" width="160" height="44" rx="6" ry="6" fill="#d0cee2" stroke="#56517e" stroke-width="1.2"/>
      <text x="148" y="464" fill="#000000" font-size="10px" text-anchor="middle">order-service</text>
      <text x="148" y="478" fill="#000000" font-size="10.5px" font-weight="bold" text-anchor="middle">pod-order-N (Writer)</text>

      <!-- Retry-Nodes Container -->
      <rect x="248" y="298" width="200" height="218" rx="8" ry="8" fill="none" stroke="#10739e" stroke-dasharray="3 3" stroke-width="1.2"/>
      <circle cx="266" cy="316" r="10" class="badge-emerald"/>
      <text x="266" y="316" class="badge-text" font-size="10px">4</text>
      <text x="356" y="316" fill="#10739e" font-size="10.5px" font-weight="bold" text-anchor="middle">Retry-Nodes (~1k)</text>
      <text x="348" y="331" fill="#666666" font-size="8.5px" text-anchor="middle">Readers (≤ W) &amp; Forward Writers</text>

      <rect x="258" y="344" width="180" height="46" rx="6" ry="6" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.2"/>
      <text x="270" y="363" fill="#000000" font-size="10px">order-service</text>
      <text x="270" y="378" fill="#000000" font-size="10.5px" font-weight="bold">retry-node-1</text>
      <rect x="366" y="356" width="64" height="20" rx="3" ry="3" fill="#ffff88" stroke="#36393d" stroke-width="1"/>
      <text x="398" y="369" fill="#000000" font-size="8px" font-weight="bold" text-anchor="middle">Retry-Support</text>

      <circle cx="348" cy="408" r="2.5" fill="#10739e"/>
      <circle cx="348" cy="418" r="2.5" fill="#10739e"/>
      <circle cx="348" cy="428" r="2.5" fill="#10739e"/>

      <rect x="258" y="445" width="180" height="46" rx="6" ry="6" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.2"/>
      <text x="270" y="464" fill="#000000" font-size="10px">order-service</text>
      <text x="270" y="479" fill="#000000" font-size="10.5px" font-weight="bold">retry-node-N</text>
      <rect x="366" y="457" width="64" height="20" rx="3" ry="3" fill="#ffff88" stroke="#36393d" stroke-width="1"/>
      <text x="398" y="470" fill="#000000" font-size="8px" font-weight="bold" text-anchor="middle">Retry-Support</text>
    </g>

    <path d="M 320 198 L 320 338" fill="none" stroke="#36393d" stroke-width="1.4" marker-end="url(#arrowhead)"/>
    <path d="M 345 250 L 345 439" fill="none" stroke="#36393d" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  </g>

  <!-- 3. CENTER DIVIDER -->
  <g id="center_divider">
    <line x1="490" y1="85" x2="490" y2="530" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1.5"/>
    <rect x="475" y="270" width="30" height="70" rx="6" ry="6" fill="#fffbe6" stroke="#d4b106" stroke-width="1.2"/>
    <text x="490" y="295" fill="#874d00" font-size="11px" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="490" y="310" fill="#874d00" font-size="9px" font-weight="bold" text-anchor="middle">NO</text>
    <text x="490" y="325" fill="#874d00" font-size="8.5px" font-weight="bold" text-anchor="middle">CROSS</text>
  </g>

  <!-- 4. VIRTUAL CLUSTER 2 -->
  <g id="virtual_cluster_2">
    <rect x="510" y="70" width="435" height="470" rx="14" ry="14" fill="none" stroke="#9673a6" stroke-dasharray="4 4" stroke-width="1.8"/>
    <text x="523" y="98" fill="#4a148c" font-size="13px" font-weight="bold">Order-Service • Virtual Cluster 2</text>
    <text x="523" y="112" fill="#666666" font-size="10px">stacksaga.instance.cluster = us-central-cluster-2</text>

    <!-- Ring-Coordinator Container -->
    <g id="vc2_coordinator">
      <rect x="523" y="122" width="410" height="138" rx="10" ry="10" fill="none" stroke="#10739e" stroke-dasharray="3 3" stroke-width="1.4"/>
      <text x="728" y="143" fill="#10739e" font-size="11.5px" font-weight="bold" text-anchor="middle">Order-Service-Ring-Coordinator (cluster-2)</text>

      <rect x="537" y="160" width="75" height="44" rx="6" ry="6" fill="#fad9d5" stroke="#ae4132" stroke-width="1.3"/>
      <text x="574.5" y="186" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Master</text>

      <rect x="695" y="156" width="140" height="42" rx="6" ry="6" fill="#ffcc99" stroke="#36393d" stroke-width="1.3"/>
      <text x="765" y="181" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Slave-1</text>

      <rect x="695" y="208" width="140" height="42" rx="6" ry="6" fill="#ffcc99" stroke="#36393d" stroke-width="1.3"/>
      <text x="765" y="233" fill="#000000" font-size="12px" font-weight="bold" text-anchor="middle">Slave-N</text>

      <path d="M 612 177 L 689 177" fill="none" stroke="#36393d" stroke-dasharray="3 3" stroke-width="1.2" marker-end="url(#arrowhead)"/>
      <path d="M 575 204 L 575 229 L 689 229" fill="none" stroke="#36393d" stroke-dasharray="3 3" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    </g>

    <!-- Nodes Container -->
    <g id="vc2_nodes">
      <rect x="523" y="270" width="410" height="258" rx="10" ry="10" fill="none" stroke="#9673a6" stroke-dasharray="3 3" stroke-width="1.4"/>
      <text x="728" y="288" fill="#4a148c" font-size="11.5px" font-weight="bold" text-anchor="middle">Order-Service Orchestrator Pods (cluster-2)</text>

      <!-- Standard-Nodes Container -->
      <rect x="533" y="298" width="180" height="218" rx="8" ry="8" fill="none" stroke="#56517e" stroke-dasharray="3 3" stroke-width="1.2"/>
      <text x="623" y="316" fill="#56517e" font-size="10.5px" font-weight="bold" text-anchor="middle">Standard-Nodes (~9k)</text>
      <text x="623" y="331" fill="#666666" font-size="8.5px" text-anchor="middle">Live Traffic • Writes Ahead (W+1)</text>

      <rect x="543" y="344" width="160" height="44" rx="6" ry="6" fill="#d0cee2" stroke="#56517e" stroke-width="1.2"/>
      <text x="623" y="363" fill="#000000" font-size="10px" text-anchor="middle">order-service</text>
      <text x="623" y="377" fill="#000000" font-size="10.5px" font-weight="bold" text-anchor="middle">pod-order-1 (Writer)</text>

      <circle cx="623" cy="408" r="2.5" fill="#56517e"/>
      <circle cx="623" cy="418" r="2.5" fill="#56517e"/>
      <circle cx="623" cy="428" r="2.5" fill="#56517e"/>

      <rect x="543" y="445" width="160" height="44" rx="6" ry="6" fill="#d0cee2" stroke="#56517e" stroke-width="1.2"/>
      <text x="623" y="464" fill="#000000" font-size="10px" text-anchor="middle">order-service</text>
      <text x="623" y="478" fill="#000000" font-size="10.5px" font-weight="bold" text-anchor="middle">pod-order-N (Writer)</text>

      <!-- Retry-Nodes Container -->
      <rect x="723" y="298" width="200" height="218" rx="8" ry="8" fill="none" stroke="#10739e" stroke-dasharray="3 3" stroke-width="1.2"/>
      <text x="823" y="316" fill="#10739e" font-size="10.5px" font-weight="bold" text-anchor="middle">Retry-Nodes (~1k)</text>
      <text x="823" y="331" fill="#666666" font-size="8.5px" text-anchor="middle">Readers (≤ W) &amp; Forward Writers</text>

      <rect x="733" y="344" width="180" height="46" rx="6" ry="6" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.2"/>
      <text x="745" y="363" fill="#000000" font-size="10px">order-service</text>
      <text x="745" y="378" fill="#000000" font-size="10.5px" font-weight="bold">retry-node-1</text>
      <rect x="841" y="356" width="64" height="20" rx="3" ry="3" fill="#ffff88" stroke="#36393d" stroke-width="1"/>
      <text x="873" y="369" fill="#000000" font-size="8px" font-weight="bold" text-anchor="middle">Retry-Support</text>

      <circle cx="823" cy="408" r="2.5" fill="#10739e"/>
      <circle cx="823" cy="418" r="2.5" fill="#10739e"/>
      <circle cx="823" cy="428" r="2.5" fill="#10739e"/>

      <rect x="733" y="445" width="180" height="46" rx="6" ry="6" fill="#b0e3e6" stroke="#0e8088" stroke-width="1.2"/>
      <text x="745" y="464" fill="#000000" font-size="10px">order-service</text>
      <text x="745" y="479" fill="#000000" font-size="10.5px" font-weight="bold">retry-node-N</text>
      <rect x="841" y="457" width="64" height="20" rx="3" ry="3" fill="#ffff88" stroke="#36393d" stroke-width="1"/>
      <text x="873" y="470" fill="#000000" font-size="8px" font-weight="bold" text-anchor="middle">Retry-Support</text>
    </g>

    <path d="M 795 198 L 795 338" fill="none" stroke="#36393d" stroke-width="1.4" marker-end="url(#arrowhead)"/>
    <path d="M 820 250 L 820 439" fill="none" stroke="#36393d" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  </g>

  <!-- 5. SHARED APACHE CASSANDRA DATABASE -->
  <g id="cassandra_storage">
    <rect x="20" y="580" width="940" height="175" rx="14" ry="14" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <circle cx="42" cy="604" r="11" class="badge-amber"/>
    <text x="42" y="604" class="badge-text">5</text>
    
    <text x="490" y="604" fill="#0f172a" font-size="13.5px" font-weight="bold" text-anchor="middle">Apache Cassandra (Shared Database Cluster &amp; Keyspace)</text>
    <text x="490" y="620" fill="#555555" font-size="10.5px" text-anchor="middle">Both virtual clusters connect to the same keyspace; Cassandra physically separates partitions via composite keys</text>

    <!-- Cluster 1 Partition Space -->
    <g id="c1_partition">
      <rect x="35" y="632" width="435" height="110" rx="8" ry="8" fill="#ffffff" stroke="#10739e" stroke-width="1.3"/>
      <rect x="45" y="642" width="165" height="20" rx="4" ry="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <text x="127.5" y="656" fill="#1d4ed8" font-size="10px" font-weight="bold" text-anchor="middle">Cluster 1 Partition Space</text>
      <text x="46" y="678" fill="#0f172a" font-size="9.5px" font-weight="bold">Tier 3 PK: ((us-central, us-central-cluster-1, order-service, date, win))</text>
      <text x="46" y="694" fill="#0e8088" font-size="9px">✓ Max 10,000 instance rows (&lt; 50,000 partition threshold)</text>
      <text x="46" y="709" fill="#64748b" font-size="9px">• Standard-Nodes write ahead (W+1) via AtomicLong</text>
      <text x="46" y="724" fill="#64748b" font-size="9px">• Cluster-1 Retry-Nodes read (≤ W) &amp; drop buckets via O(1) tombstones</text>
    </g>

    <!-- Cluster 2 Partition Space -->
    <g id="c2_partition">
      <rect x="510" y="632" width="435" height="110" rx="8" ry="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.3"/>
      <rect x="520" y="642" width="165" height="20" rx="4" ry="4" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="602.5" y="656" fill="#6d28d9" font-size="10px" font-weight="bold" text-anchor="middle">Cluster 2 Partition Space</text>
      <text x="521" y="678" fill="#0f172a" font-size="9.5px" font-weight="bold">Tier 3 PK: ((us-central, us-central-cluster-2, order-service, date, win))</text>
      <text x="521" y="694" fill="#6d28d9" font-size="9px">✓ Max 10,000 instance rows (&lt; 50,000 partition threshold)</text>
      <text x="521" y="709" fill="#64748b" font-size="9px">• Standard-Nodes write ahead (W+1) via AtomicLong</text>
      <text x="521" y="724" fill="#64748b" font-size="9px">• Cluster-2 Retry-Nodes read (≤ W) &amp; drop buckets via O(1) tombstones</text>
    </g>

    <path d="M 252 540 L 252 626" fill="none" stroke="#10739e" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrowhead-blue)"/>
    <path d="M 727 540 L 727 626" fill="none" stroke="#7b1fa2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrowhead)"/>
  </g>
</svg>
