<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aGrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94A3B8"/></marker>
    <marker id="aMy" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0E7490"/></marker>
    <marker id="aPg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#4338CA"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="550" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">StackSaga SQL Partition Architecture — One Runner per Database Engine</text>

  <!-- column headers -->
  <text x="165" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Microservices (DML only)</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Event-Store Databases</text>
  <text x="822" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Partition Runners — one per engine</text>
  <text x="333" y="78" text-anchor="middle" font-size="9" fill="#94A3B8">DML write</text>
  <text x="636" y="78" text-anchor="middle" font-size="9" fill="#94A3B8">partition DDL</text>

  <!-- ===== Column A: microservices ===== -->
  <g>
    <rect x="20" y="82" width="290" height="70" rx="10" fill="#F1F5F9" stroke="#0E7490" stroke-width="1.5"/>
    <text x="32" y="108" font-size="13" font-weight="700" fill="#0F172A">Order Service</text>
    <text x="32" y="128" font-size="11" fill="#475569">stacksaga-mysql-reactive-support</text>
    <rect x="240" y="92" width="58" height="18" rx="9" fill="#0E7490"/><text x="269" y="105" text-anchor="middle" font-size="10" fill="#ffffff">MySQL</text>

    <rect x="20" y="162" width="290" height="70" rx="10" fill="#F1F5F9" stroke="#0E7490" stroke-width="1.5"/>
    <text x="32" y="188" font-size="13" font-weight="700" fill="#0F172A">Inventory Service</text>
    <text x="32" y="208" font-size="11" fill="#475569">stacksaga-mysql-reactive-support</text>
    <rect x="240" y="172" width="58" height="18" rx="9" fill="#0E7490"/><text x="269" y="185" text-anchor="middle" font-size="10" fill="#ffffff">MySQL</text>

    <rect x="20" y="242" width="290" height="70" rx="10" fill="#F1F5F9" stroke="#4338CA" stroke-width="1.5"/>
    <text x="32" y="268" font-size="13" font-weight="700" fill="#0F172A">Payment Service</text>
    <text x="32" y="288" font-size="11" fill="#475569">stacksaga-pg-reactive-support</text>
    <rect x="224" y="252" width="74" height="18" rx="9" fill="#4338CA"/><text x="261" y="265" text-anchor="middle" font-size="10" fill="#ffffff">PostgreSQL</text>

    <rect x="20" y="326" width="290" height="92" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="32" y="350" font-size="12" font-weight="700" fill="#B45309">No partition DDL in app pods</text>
    <text x="32" y="371" font-size="11" fill="#7C5E10">• Minimal runtime privilege (DML only)</text>
    <text x="32" y="389" font-size="11" fill="#7C5E10">• No ALTER / CREATE grants needed</text>
    <text x="32" y="407" font-size="11" fill="#7C5E10">• Avoids metadata locks &amp; startup timeouts</text>
  </g>

  <!-- ===== Column B: databases ===== -->
  <g>
    <rect x="355" y="82" width="250" height="160" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/>
    <text x="368" y="101" font-size="11" font-weight="700" fill="#0E7490">MySQL engine</text>
    <rect x="370" y="108" width="220" height="52" rx="8" fill="#ffffff" stroke="#0E7490" stroke-width="1.2"/>
    <text x="384" y="130" font-size="12" font-weight="700" fill="#0F172A">Order DB</text>
    <text x="384" y="148" font-size="10" fill="#475569">MySQL · es_transaction (+3 tables)</text>
    <rect x="370" y="172" width="220" height="52" rx="8" fill="#ffffff" stroke="#0E7490" stroke-width="1.2"/>
    <text x="384" y="194" font-size="12" font-weight="700" fill="#0F172A">Inventory DB</text>
    <text x="384" y="212" font-size="10" fill="#475569">MySQL · es_transaction (+3 tables)</text>

    <rect x="355" y="256" width="250" height="110" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="368" y="275" font-size="11" font-weight="700" fill="#4338CA">PostgreSQL engine</text>
    <rect x="370" y="284" width="220" height="60" rx="8" fill="#ffffff" stroke="#4338CA" stroke-width="1.2"/>
    <text x="384" y="308" font-size="12" font-weight="700" fill="#0F172A">Payment DB</text>
    <text x="384" y="326" font-size="10" fill="#475569">PostgreSQL · es_transaction (+3 tables)</text>
  </g>

  <!-- ===== Column C: runners ===== -->
  <g>
    <rect x="665" y="82" width="315" height="160" rx="12" fill="#ffffff" stroke="#0E7490" stroke-width="2"/>
    <text x="680" y="107" font-size="13" font-weight="700" fill="#0E7490">MySQL Partition Runner</text>
    <line x1="680" y1="116" x2="965" y2="116" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="680" y="124" width="196" height="18" rx="9" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/><text x="778" y="137" text-anchor="middle" font-size="10" fill="#0E7490">Docker image / Application (JAR)</text>
    <text x="680" y="161" font-size="11" font-weight="700" fill="#0E7490">stacksaga/partition-runner-mysql</text>
    <text x="680" y="181" font-size="11" fill="#334155">• REORGANIZE PARTITION p_max (dialect auto-detected)</text>
    <text x="680" y="201" font-size="11" fill="#334155">• Maintains every MySQL event-store DB concurrently</text>
    <text x="680" y="221" font-size="11" fill="#334155">• ahead-count pre-creates today + future partitions</text>

    <rect x="665" y="256" width="315" height="110" rx="12" fill="#ffffff" stroke="#4338CA" stroke-width="2"/>
    <text x="680" y="281" font-size="13" font-weight="700" fill="#4338CA">PostgreSQL Partition Runner</text>
    <line x1="680" y1="290" x2="965" y2="290" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="680" y="298" width="196" height="18" rx="9" fill="#EEF2FF" stroke="#4338CA" stroke-width="1"/><text x="778" y="311" text-anchor="middle" font-size="10" fill="#4338CA">Docker image / Application (JAR)</text>
    <text x="680" y="335" font-size="11" font-weight="700" fill="#4338CA">stacksaga/partition-runner-postgres</text>
    <text x="680" y="355" font-size="11" fill="#334155">• CREATE TABLE … PARTITION OF · maintains every PostgreSQL DB</text>
  </g>

  <!-- ===== arrows ===== -->
  <!-- DML: service -> db -->
  <path d="M310,118 L362,134" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aGrey)"/>
  <path d="M310,198 L362,198" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aGrey)"/>
  <path d="M310,278 L362,312" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aGrey)"/>
  <!-- DDL: runner -> engine group -->
  <path d="M665,162 L611,175" fill="none" stroke="#0E7490" stroke-width="2" marker-end="url(#aMy)"/>
  <path d="M665,311 L611,314" fill="none" stroke="#4338CA" stroke-width="2" marker-end="url(#aPg)"/>

  <!-- ===== bottom band ===== -->
  <rect x="20" y="438" width="960" height="94" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="462" font-size="13" font-weight="700" fill="#0F172A">Deploy one runner per engine — as a pre-built Docker image (zero code) or a standalone application (JAR)</text>
  <text x="40" y="485" font-size="11" fill="#334155">• Daemon: runs on startup + daily noon cron (0 0 12 * * *)        • Kubernetes CronJob: CRON=none + EXIT_ON_COMPLETION=true → run once, exit 0/1</text>
  <text x="40" y="505" font-size="11" fill="#334155">• Datasources injected at runtime via env vars or a mounted application.yml — no code, no rebuild</text>
  <text x="40" y="523" font-size="11" fill="#334155">• A single runner serves many datasources of the same engine; mixed shops run one MySQL + one PostgreSQL runner</text>
</svg>
