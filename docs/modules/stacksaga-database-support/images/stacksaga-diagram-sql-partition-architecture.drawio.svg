<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: #ffffff;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000px" height="620px" viewBox="-0.5 -0.5 1000 620">
  <defs/>
  <rect fill="#ffffff" width="100%" height="100%" x="0" y="0"/>
  <g>
    <!-- Outer boundary: Distributed System Environment -->
    <rect x="20" y="20" width="960" height="580" rx="20" ry="20" fill="#f8f9fa" stroke="#4bb543" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="500" y="48" fill="#2d572c" font-family="Helvetica, Arial, sans-serif" font-size="18px" font-weight="bold" text-anchor="middle">StackSaga Multi-Service Ecosystem — Database Partition Architecture</text>

    <!-- Zone A: Microservices Instances -->
    <rect x="50" y="70" width="410" height="500" rx="14" ry="14" fill="#ffffff" stroke="#3399ff" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="255" y="98" fill="#0056b3" font-family="Helvetica, Arial, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle">Application Cluster (Multi-Instance Microservices)</text>
    <text x="255" y="118" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12px" text-anchor="middle">Each service instance embeds high-throughput reactive DB support</text>

    <!-- Order Service Box -->
    <rect x="75" y="135" width="360" height="95" rx="10" ry="10" fill="#f0f7ff" stroke="#3399ff" stroke-width="1.5"/>
    <text x="95" y="160" fill="#003366" font-family="Helvetica, Arial, sans-serif" font-size="14px" font-weight="bold">Order Service (Pods: #1, #2, ... #N)</text>
    <rect x="95" y="172" width="320" height="42" rx="6" ry="6" fill="#e1effe" stroke="#76a9fa"/>
    <text x="255" y="198" fill="#1e429f" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">stacksaga-mysql-reactive-support (Event-Store)</text>

    <!-- Payment Service Box -->
    <rect x="75" y="245" width="360" height="95" rx="10" ry="10" fill="#f0fdf4" stroke="#31c48d" stroke-width="1.5"/>
    <text x="95" y="270" fill="#03543f" font-family="Helvetica, Arial, sans-serif" font-size="14px" font-weight="bold">Payment Service (Pods: #1, #2, ... #N)</text>
    <rect x="95" y="282" width="320" height="42" rx="6" ry="6" fill="#def7ec" stroke="#31c48d"/>
    <text x="255" y="308" fill="#03543f" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">stacksaga-pg-reactive-support (Event-Store)</text>

    <!-- Inventory Service Box -->
    <rect x="75" y="355" width="360" height="95" rx="10" ry="10" fill="#fdf2f8" stroke="#f17eb8" stroke-width="1.5"/>
    <text x="95" y="380" fill="#99154b" font-family="Helvetica, Arial, sans-serif" font-size="14px" font-weight="bold">Inventory Service (Pods: #1, #2, ... #N)</text>
    <rect x="95" y="392" width="320" height="42" rx="6" ry="6" fill="#fce8f3" stroke="#f17eb8"/>
    <text x="255" y="418" fill="#99154b" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">stacksaga-mysql-reactive-support (Event-Store)</text>

    <rect x="75" y="465" width="360" height="85" rx="8" ry="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="488" fill="#b45309" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">Notice: No Partition DDL in App Instances!</text>
    <text x="90" y="508" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="11px">• App instances run with minimal runtime privilege (DML only)</text>
    <text x="90" y="525" fill="#78350f" font-family="Helvetica, Arial, sans-serif" font-size="11px">• Prevents distributed metadata locks &amp; startup timeouts</text>

    <!-- Center Column: Databases -->
    <!-- Order DB -->
    <path d="M 490 155 C 490 148 510 142 535 142 C 560 142 580 148 580 155 L 580 195 C 580 202 560 208 535 208 C 510 208 490 202 490 195 Z" fill="#ffffff" stroke="#e88b1a" stroke-width="2"/>
    <path d="M 490 155 C 490 162 510 168 535 168 C 560 168 580 162 580 155" fill="none" stroke="#e88b1a" stroke-width="2"/>
    <text x="535" y="185" fill="#7c2d12" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Order DB</text>
    <text x="535" y="198" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">(MySQL)</text>

    <!-- Payment DB -->
    <path d="M 490 265 C 490 258 510 252 535 252 C 560 252 580 258 580 265 L 580 305 C 580 312 560 318 535 318 C 510 318 490 312 490 305 Z" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
    <path d="M 490 265 C 490 272 510 278 535 278 C 560 278 580 272 580 265" fill="none" stroke="#0066cc" stroke-width="2"/>
    <text x="535" y="295" fill="#1e3a8a" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Payment DB</text>
    <text x="535" y="308" fill="#1e40af" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">(PostgreSQL)</text>

    <!-- Inventory DB -->
    <path d="M 490 375 C 490 368 510 362 535 362 C 560 362 580 368 580 375 L 580 415 C 580 422 560 428 535 428 C 510 428 490 422 490 415 Z" fill="#ffffff" stroke="#e88b1a" stroke-width="2"/>
    <path d="M 490 375 C 490 382 510 388 535 388 C 560 388 580 382 580 375" fill="none" stroke="#e88b1a" stroke-width="2"/>
    <text x="535" y="405" fill="#7c2d12" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Inventory DB</text>
    <text x="535" y="418" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">(MySQL)</text>

    <!-- DML Read/Write Arrows from Services to DBs -->
    <path d="M 435 180 L 485 180" fill="none" stroke="#3399ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M 435 290 L 485 290" fill="none" stroke="#31c48d" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <path d="M 435 400 L 485 400" fill="none" stroke="#f17eb8" stroke-width="2" marker-end="url(#arrowPink)"/>

    <!-- Zone B: Centralized Partition Runner (Only 1 Instance!) -->
    <rect x="610" y="70" width="350" height="500" rx="14" ry="14" fill="#ffffff" stroke="#ff5a1f" stroke-width="2.5"/>
    <rect x="625" y="85" width="320" height="50" rx="8" ry="8" fill="#ff5a1f"/>
    <text x="785" y="106" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">Central Partition Worker</text>
    <text x="785" y="124" fill="#fff1ed" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">⚡ ONLY 1 INSTANCE FOR ENTIRE SYSTEM</text>

    <!-- Inside Central Partition Runner -->
    <rect x="625" y="145" width="320" height="410" rx="10" ry="10" fill="#fff8f5" stroke="#ffd8cc" stroke-width="1.5"/>
    <text x="785" y="170" fill="#c2410c" font-family="Helvetica, Arial, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle">stacksaga-sql-partition-support</text>

    <!-- Feature box 1: Trigger -->
    <rect x="640" y="185" width="290" height="50" rx="6" ry="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="205" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">📅 Scheduled &amp; Startup Trigger</text>
    <text x="655" y="223" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">Runs on startup + Daily noon cron (12:00 PM)</text>

    <!-- Feature box 2: Concurrent Multi-Datasource -->
    <rect x="640" y="245" width="290" height="60" rx="6" ry="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="265" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">🔀 Multi-Datasource &amp; Concurrency</text>
    <text x="655" y="283" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">Processes all DBs concurrently via reactive</text>
    <text x="655" y="297" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">Flux.flatMap(concurrency = 4)</text>

    <!-- Feature box 3: Multi-Engine Dialects -->
    <rect x="640" y="315" width="290" height="60" rx="6" ry="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="335" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">🛠 Mixed SQL Dialects Auto-Detected</text>
    <text x="655" y="353" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">• MySQL: REORGANIZE PARTITION p_max</text>
    <text x="655" y="367" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">• PostgreSQL: Declarative PARTITION OF</text>

    <!-- Feature box 4: Unpooled Connection -->
    <rect x="640" y="385" width="290" height="50" rx="6" ry="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="405" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">🔌 Unpooled On-Demand Connection</text>
    <text x="655" y="423" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">Opens connection, executes DDL, closes immediately</text>

    <!-- Feature box 5: Security / Validation -->
    <rect x="640" y="445" width="290" height="50" rx="6" ry="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="655" y="465" fill="#9a3412" font-family="Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold">🔒 Startup Privilege Validation</text>
    <text x="655" y="483" fill="#4b5563" font-family="Helvetica, Arial, sans-serif" font-size="11px">Validates ALTER / CREATE grants ahead of time</text>

    <text x="785" y="525" fill="#ea580c" font-family="Helvetica, Arial, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle">Creates partitions for: es_transaction &amp; tryout</text>
    <text x="785" y="542" fill="#6b7280" font-family="Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle">Ahead-Count: pre-creates today + future days</text>

    <!-- DDL lines from Central Runner back to all DBs -->
    <path d="M 640 215 C 600 200 595 180 580 180" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 2"/>
    <path d="M 640 275 C 600 280 595 290 580 290" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 2"/>
    <path d="M 640 345 C 600 370 595 400 580 400" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 2"/>
  </g>
</svg>
