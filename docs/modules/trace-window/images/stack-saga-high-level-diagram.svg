<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#28b76b" />
    </marker>
    <marker id="arrow-darkgreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#157341" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="675" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f5132">StackSaga - High-Level Ecosystem Architecture</text>
  <text x="675" y="68" text-anchor="middle" font-size="13" fill="#64748b">Decoupled Architecture: Client Ingress, Developer Microservices, Local Event-Stores &amp; StackSaga Central Control Plane</text>

  <!-- ============================================================== -->
  <!-- 1. DEVELOPER MICROSERVICE CLUSTER (GREY DASHED CONTAINER)       -->
  <!-- ============================================================== -->
  <rect x="50" y="95" width="880" height="570" rx="14" fill="#fafafa" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,6" />
  <rect x="65" y="83" width="280" height="24" rx="6" fill="#f3f4f6" />
  <text x="75" y="99" font-size="12" font-weight="700" fill="#4b5563">Developer's Microservice Infrastructure</text>

  <!-- MICROSERVICE 3: Payment Service -->
  <rect x="386" y="136" width="220" height="105" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="378" y="128" width="220" height="105" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="370" y="120" width="220" height="105" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2" filter="url(#shadow)" />
  <text x="480" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">payment-service</text>
  <text x="480" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">(StackSaga Connector)</text>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Spring MVC / WebFlux</text>

  <!-- MS-3 Databases -->
  <g transform="translate(100, 130)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#4b5563">service-db</text>
  </g>

  <g transform="translate(200, 130)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#d2f4e3" stroke="#28b76b" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#e6f9f0" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Event-Store</text>
  </g>

  <!-- Connectors MS-3 to DBs -->
  <path d="M 370,155 L 170,155" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 370,185 L 270,185" fill="none" stroke="#28b76b" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- MICROSERVICE 2: Inventory Service -->
  <rect x="386" y="286" width="220" height="105" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="378" y="278" width="220" height="105" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="370" y="270" width="220" height="105" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2" filter="url(#shadow)" />
  <text x="480" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">inventory-service</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">(StackSaga Connector)</text>
  <text x="480" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Spring MVC / WebFlux</text>

  <!-- MS-2 Databases -->
  <g transform="translate(100, 280)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#4b5563">service-db</text>
  </g>

  <g transform="translate(200, 280)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#d2f4e3" stroke="#28b76b" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#e6f9f0" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Event-Store</text>
  </g>

  <!-- Connectors MS-2 to DBs -->
  <path d="M 370,305 L 170,305" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 370,335 L 270,335" fill="none" stroke="#28b76b" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- MICROSERVICE 1: Order Service -->
  <rect x="386" y="436" width="220" height="105" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="378" y="428" width="220" height="105" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="370" y="420" width="220" height="105" rx="12" fill="#ffffff" stroke="#4b5563" stroke-width="2" filter="url(#shadow)" />
  <text x="480" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">order-service</text>
  <text x="480" y="478" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">(StackSaga Connector)</text>
  <text x="480" y="500" text-anchor="middle" font-size="11" fill="#6b7280">Spring MVC / WebFlux</text>

  <!-- MS-1 Databases -->
  <g transform="translate(100, 430)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#4b5563">service-db</text>
  </g>

  <g transform="translate(200, 430)">
    <path d="M0,15 A35,15 0 0,0 70,15 A35,15 0 0,0 0,15 L0,65 A35,15 0 0,0 70,65 L70,15 Z" fill="#d2f4e3" stroke="#28b76b" stroke-width="1.5" />
    <ellipse cx="35" cy="15" rx="35" ry="12" fill="#e6f9f0" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,32 A35,10 0 0,0 70,32" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <path d="M0,48 A35,10 0 0,0 70,48" fill="none" stroke="#28b76b" stroke-width="1.5" />
    <text x="35" y="44" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Event-Store</text>
  </g>

  <!-- Connectors MS-1 to DBs -->
  <path d="M 370,455 L 170,455" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <path d="M 370,485 L 270,485" fill="none" stroke="#28b76b" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- API GATEWAY / REVERSE PROXY -->
  <rect x="710" y="240" width="180" height="180" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2" filter="url(#shadow)" />
  <rect x="735" y="255" width="130" height="30" rx="6" fill="#f3f4f6" />
  <text x="800" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">INBOUND INGRESS</text>
  <text x="800" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">API Gateway</text>
  <text x="800" y="338" text-anchor="middle" font-size="12" fill="#6b7280">Reverse Proxy / Ingress</text>
  <text x="800" y="360" text-anchor="middle" font-size="11" fill="#9ca3af">(Spring Cloud / Kong / Envoy)</text>
  <rect x="730" y="380" width="140" height="24" rx="12" fill="#e6f9f0" stroke="#28b76b" stroke-width="1" />
  <text x="800" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Target URL Endpoint</text>

  <!-- Clean, Non-overlapping Gateway Routes to Microservices -->
  <!-- Top: To MS-3 -->
  <path d="M 710,280 C 650,280 650,172 590,172" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)" />
  <!-- Middle: To MS-2 -->
  <path d="M 710,330 L 590,330" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)" />
  <!-- Bottom: To MS-1 -->
  <path d="M 710,380 C 650,380 650,472 590,472" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)" />


  <!-- ============================================================== -->
  <!-- 2. EXTERNAL CLIENTS CONTAINER                                   -->
  <!-- ============================================================== -->
  <rect x="1000" y="235" width="140" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="1070" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">External Clients</text>

  <rect x="1015" y="275" width="110" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="1070" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">💻 Web Client</text>

  <rect x="1015" y="317" width="110" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="1070" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">📱 Mobile App</text>

  <rect x="1015" y="359" width="110" height="32" rx="6" fill="#ffffff" stroke="#94a3b8" />
  <text x="1070" y="379" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">☁️ Third Party</text>

  <!-- Client traffic into Gateway -->
  <path d="M 1000,330 L 890,330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)" />
  <text x="945" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">HTTP/REST</text>


  <!-- ============================================================== -->
  <!-- 3. STACKSAGA CLOUD (CONTROL PLANE)                             -->
  <!-- ============================================================== -->
  <rect x="360" y="730" width="550" height="190" rx="14" fill="#fafffc" stroke="#28b76b" stroke-width="2" stroke-dasharray="6,6" />
  <rect x="375" y="718" width="230" height="24" rx="6" fill="#e6f9f0" />
  <text x="385" y="734" font-size="12" font-weight="700" fill="#0f5132">StackSaga Cloud (Control Plane)</text>

  <!-- StackSaga Central (Hexagon Shape) -->
  <g transform="translate(390, 765)">
    <polygon points="25,0 135,0 160,50 135,100 25,100 0,50" fill="#e6f9f0" stroke="#28b76b" stroke-width="2.5" filter="url(#shadow)" />
    <text x="80" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#0a3d24">StackSaga</text>
    <text x="80" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#0a3d24">Central</text>
    <text x="80" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#157341">(Auth Plane)</text>
  </g>

  <!-- Central DB -->
  <g transform="translate(680, 775)">
    <path d="M0,18 A45,18 0 0,0 90,18 A45,18 0 0,0 0,18 L0,70 A45,18 0 0,0 90,70 L90,18 Z" fill="#28b76b" stroke="#157341" stroke-width="2" />
    <ellipse cx="45" cy="18" rx="45" ry="14" fill="#3cd684" stroke="#157341" stroke-width="2" />
    <path d="M0,36 A45,12 0 0,0 90,36" fill="none" stroke="#157341" stroke-width="2" />
    <path d="M0,54 A45,12 0 0,0 90,54" fill="none" stroke="#157341" stroke-width="2" />
    <text x="45" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Central DB</text>
    <text x="45" y="64" text-anchor="middle" font-size="9" fill="#e6f9f0">Tokens &amp; ACL</text>
  </g>

  <!-- Central to Central DB connection -->
  <path d="M 550,815 L 680,815" fill="none" stroke="#28b76b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)" />


  <!-- ============================================================== -->
  <!-- 4. OPERATOR / TRACEWINDOW DASHBOARD                            -->
  <!-- ============================================================== -->
  <g transform="translate(1010, 735)">
    <!-- Actor Box -->
    <rect x="0" y="0" width="220" height="180" rx="14" fill="#ffffff" stroke="#28b76b" stroke-width="2" filter="url(#shadow)" />
    <!-- Avatar circle -->
    <circle cx="110" cy="40" r="22" fill="#e6f9f0" stroke="#28b76b" stroke-width="2" />
    <circle cx="110" cy="34" r="9" fill="#0f5132" />
    <path d="M 96,49 C 96,43 124,43 124,49 Z" fill="#0f5132" />

    <text x="110" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">TraceWindow</text>
    <text x="110" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Frontend Dashboard</text>
    <text x="110" y="125" text-anchor="middle" font-size="11" fill="#6b7280">Developer &amp; Team</text>
    <rect x="25" y="138" width="170" height="24" rx="6" fill="#f0fdf4" stroke="#28b76b" stroke-width="1" />
    <text x="110" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">GitHub OAuth Session</text>
  </g>


  <!-- ============================================================== -->
  <!-- 5. CROSS-PLANE INTERACTION FLOWS (CLEAN, NO OVERLAPS)          -->
  <!-- ============================================================== -->

  <!-- Flow 1: TraceWindow to StackSaga Central (GitHub Login & Token Mgmt) -->
  <!-- Clean bottom arc running below Central DB directly into Central -->
  <path d="M 1010,865 L 780,865 C 670,865 600,865 530,835" fill="none" stroke="#28b76b" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <g transform="translate(860, 840)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#ffffff" stroke="#28b76b" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">1. GitHub OAuth &amp; Token Setup</text>
  </g>

  <!-- Flow 2: TraceWindow to API Gateway (Target URL Fetch) -->
  <!-- Clean diagonal bezier into Gateway base -->
  <path d="M 1060,735 C 1060,560 810,560 810,420" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)" />
  <g transform="translate(935, 520)">
    <rect x="-140" y="-18" width="280" height="36" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)" />
    <text x="0" y="-3" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">2. GET Traces via Target URL</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#6b7280">{host:port}/{service-name}/{api-path}</text>
  </g>

  <!-- Flow 3: Microservices Dual-Token Security Verification down to StackSaga Central -->
  <!-- Clear trunk line on left border of services running down to Central -->
  <path d="M 370,172 L 325,172 L 325,815 L 390,815" fill="none" stroke="#157341" stroke-width="2.5" marker-end="url(#arrow-darkgreen)" />
  <path d="M 370,322 L 325,322" fill="none" stroke="#157341" stroke-width="2.5" />
  <path d="M 370,472 L 325,472" fill="none" stroke="#157341" stroke-width="2.5" />

  <!-- Shield Badge on Trunk Line -->
  <g transform="translate(325, 625)">
    <path d="M -15,-18 L 15,-18 L 15,5 C 15,16 0,24 0,24 C 0,24 -15,16 -15,5 Z" fill="#e6f9f0" stroke="#157341" stroke-width="2" />
    <circle cx="0" cy="1" r="3" fill="#157341" />
    <path d="M -2,4 L 2,4 L 3,9 L -3,9 Z" fill="#157341" />
    <rect x="25" y="-14" width="225" height="26" rx="8" fill="#ffffff" stroke="#157341" stroke-width="1.5" />
    <text x="137" y="3" text-anchor="middle" font-size="11" font-weight="700" fill="#0a3d24">3. Dual-Token Verification</text>
  </g>

</svg>