<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 820" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow-direct" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer><feFuncA type="linear" slope="0.08" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arr-green-dir" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#28b76b" />
    </marker>
    <marker id="arr-darkgreen-dir" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#157341" />
    </marker>
    <marker id="arr-gray-dir" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title & Subtitle Banner -->
  <text x="675" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f5132">StackSaga TraceWindow - Direct Mode</text>
  <text x="675" y="62" text-anchor="middle" font-size="13" fill="#64748b">Direct Service Access Architecture without Intermediate API Gateway</text>

  <!-- Target URL Pattern Badge -->
  <rect x="365" y="80" width="620" height="34" rx="17" fill="#e6f9f0" stroke="#28b76b" stroke-width="1.5" />
  <text x="675" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5132">Target URL Pattern: {host:port}/{api-path}  (e.g., http://localhost:8081/stacksaga/traces)</text>

  <!-- ============================================================== -->
  <!-- 1. LEFT ACTOR: DEVELOPER / TEAM                                -->
  <!-- ============================================================== -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="150" height="145" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow-direct)" />
    <!-- User Avatar -->
    <circle cx="75" cy="42" r="22" fill="#e6f9f0" stroke="#28b76b" stroke-width="2" />
    <circle cx="75" cy="36" r="9" fill="#0f5132" />
    <path d="M 61,51 C 61,45 89,45 89,51 Z" fill="#0f5132" />
    <text x="75" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Team / Operator</text>
    <text x="75" y="105" text-anchor="middle" font-size="11" fill="#6b7280">Developer Workstation</text>
    <text x="75" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Browser Session</text>
  </g>

  <!-- ============================================================== -->
  <!-- 2. TOP REGION: STACKSAGA CLOUD (CONTROL PLANE)                 -->
  <!-- ============================================================== -->
  <rect x="290" y="150" width="990" height="230" rx="14" fill="#fafffc" stroke="#28b76b" stroke-width="2" stroke-dasharray="6,6" />
  <!-- Boundary Header Tag safely inside boundary -->
  <rect x="310" y="162" width="240" height="26" rx="6" fill="#e6f9f0" stroke="#28b76b" stroke-width="1.2" />
  <text x="430" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5132">StackSaga Cloud (Control Plane)</text>

  <!-- Dashboard UI: TraceWindow -->
  <rect x="330" y="208" width="220" height="145" rx="12" fill="#ffffff" stroke="#28b76b" stroke-width="2" filter="url(#shadow-direct)" />
  <rect x="355" y="223" width="170" height="24" rx="6" fill="#f0fdf4" stroke="#28b76b" stroke-width="1" />
  <text x="440" y="239" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">Web Console UI</text>
  <text x="440" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">TraceWindow</text>
  <text x="440" y="303" text-anchor="middle" font-size="12" fill="#6b7280">trace.stacksaga.org</text>
  <text x="440" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Visual Saga Dashboard</text>

  <!-- StackSaga Central (Hexagon) -->
  <g transform="translate(690, 195)">
    <polygon points="25,0 155,0 180,65 155,130 25,130 0,65" fill="#e6f9f0" stroke="#28b76b" stroke-width="2.5" filter="url(#shadow-direct)" />
    <text x="90" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3d24">StackSaga</text>
    <text x="90" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#0a3d24">Central</text>
    <text x="90" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#157341">(Auth Plane)</text>
  </g>

  <!-- Central Database (Clean Modern Card with Minimal DB Glyph) -->
  <g transform="translate(1065, 205)">
    <rect x="0" y="0" width="145" height="115" rx="12" fill="#f0fdf4" stroke="#28b76b" stroke-width="2" filter="url(#shadow-direct)" />
    <!-- Mini modern database icon -->
    <g transform="translate(57, 18)">
      <ellipse cx="15" cy="5" rx="15" ry="4" fill="#28b76b" />
      <path d="M0,5 L0,15 A15,4 0 0,0 30,15 L30,5 Z" fill="#28b76b" />
      <path d="M0,11 A15,4 0 0,0 30,11" fill="none" stroke="#e6f9f0" stroke-width="1.2" />
    </g>
    <text x="72" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#0a3d24">Central DB</text>
    <text x="72" y="85" text-anchor="middle" font-size="11" fill="#157341">Tokens &amp; ACL</text>
    <text x="72" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#28b76b">Cloud Storage</text>
  </g>

  <!-- Central to Central DB link -->
  <path d="M 870,260 L 1065,260" fill="none" stroke="#28b76b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-green-dir)" />

  <!-- ============================================================== -->
  <!-- 3. BOTTOM REGION: DEVELOPER BACKEND INFRASTRUCTURE (DIRECT)   -->
  <!-- Fully enclosed continuous rectangle starting at x=200          -->
  <!-- ============================================================== -->
  <rect x="200" y="440" width="1080" height="340" rx="14" fill="#fafafa" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,6" />
  <!-- Boundary Header Tag safely inside boundary -->
  <rect x="220" y="452" width="460" height="26" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" />
  <text x="450" y="469" text-anchor="middle" font-size="12" font-weight="700" fill="#4b5563">Developer&#39;s Backend Infrastructure (Direct Service - No Gateway)</text>

  <!-- order-service Layered Cards -->
  <rect x="426" y="546" width="310" height="150" rx="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="418" y="538" width="310" height="150" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" />
  <rect x="410" y="530" width="310" height="150" rx="14" fill="#ffffff" stroke="#4b5563" stroke-width="2" filter="url(#shadow-direct)" />

  <text x="565" y="565" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">order-service</text>
  <text x="565" y="590" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">(StackSaga TraceWindow Connector)</text>
  <rect x="430" y="608" width="270" height="26" rx="6" fill="#e6f9f0" stroke="#28b76b" stroke-width="1" />
  <text x="565" y="625" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">Direct Port: http://localhost:8081</text>
  <text x="565" y="660" text-anchor="middle" font-size="11" fill="#6b7280">Embedded Servlet / WebFlux Engine</text>

  <!-- Security Shield Badge on order-service -->
  <g transform="translate(565, 495)">
    <path d="M -18,-20 L 18,-20 L 18,6 C 18,18 0,26 0,26 C 0,26 -18,18 -18,6 Z" fill="#e6f9f0" stroke="#28b76b" stroke-width="2" />
    <circle cx="0" cy="1" r="3.5" fill="#0f5132" />
    <path d="M -2.5,4.5 L 2.5,4.5 L 3.5,10 L -3.5,10 Z" fill="#0f5132" />
    <rect x="25" y="-12" width="130" height="22" rx="6" fill="#ffffff" stroke="#28b76b" stroke-width="1.5" />
    <text x="90" y="3" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Security Interceptor</text>
  </g>

  <!-- Developer Modern Database Cards -->
  <!-- 1. service-db -->
  <g transform="translate(845, 545)">
    <rect x="0" y="0" width="135" height="115" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow-direct)" />
    <!-- Mini db icon -->
    <g transform="translate(52, 18)">
      <ellipse cx="15" cy="5" rx="15" ry="4" fill="#9ca3af" />
      <path d="M0,5 L0,15 A15,4 0 0,0 30,15 L30,5 Z" fill="#9ca3af" />
      <path d="M0,11 A15,4 0 0,0 30,11" fill="none" stroke="#ffffff" stroke-width="1.2" />
    </g>
    <text x="67" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">service-db</text>
    <text x="67" y="85" text-anchor="middle" font-size="11" fill="#6b7280">Business Data</text>
    <text x="67" y="100" text-anchor="middle" font-size="10" fill="#9ca3af">SQL / NoSQL</text>
  </g>

  <!-- 2. Event-Store -->
  <g transform="translate(1065, 545)">
    <rect x="0" y="0" width="145" height="115" rx="12" fill="#f0fdf4" stroke="#28b76b" stroke-width="2" filter="url(#shadow-direct)" />
    <!-- Mini db icon -->
    <g transform="translate(57, 18)">
      <ellipse cx="15" cy="5" rx="15" ry="4" fill="#28b76b" />
      <path d="M0,5 L0,15 A15,4 0 0,0 30,15 L30,5 Z" fill="#28b76b" />
      <path d="M0,11 A15,4 0 0,0 30,11" fill="none" stroke="#e6f9f0" stroke-width="1.2" />
    </g>
    <text x="72" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#0f5132">Event-Store</text>
    <text x="72" y="85" text-anchor="middle" font-size="11" fill="#157341">Saga Traces &amp; Logs</text>
    <text x="72" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#28b76b">Immutable Log</text>
  </g>

  <!-- Connections from service to databases -->
  <path d="M 720,590 L 845,590" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray-dir)" />
  <text x="782" y="582" text-anchor="middle" font-size="10" fill="#9ca3af">CRUD</text>

  <!-- ============================================================== -->
  <!-- 4. NUMBERED STEP FLOWS (DIRECT MODE)                           -->
  <!-- ============================================================== -->

  <!-- STEP 1: Developer Accesses TraceWindow -->
  <path d="M 210,270 L 330,270" fill="none" stroke="#28b76b" stroke-width="2.5" marker-end="url(#arr-green-dir)" />
  <g transform="translate(265, 270)">
    <circle cx="0" cy="0" r="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  </g>

  <!-- STEP 2: TraceWindow directly to order-service (NO GATEWAY) -->
  <path d="M 380,353 C 380,430 330,480 330,580 L 410,580" fill="none" stroke="#28b76b" stroke-width="2.8" marker-end="url(#arr-green-dir)" />
  <!-- Badge placed cleanly with no border collision -->
  <g transform="translate(325, 495)">
    <rect x="-105" y="-19" width="210" height="38" rx="10" fill="#ffffff" stroke="#28b76b" stroke-width="1.5" filter="url(#shadow-direct)" />
    <circle cx="-85" cy="0" r="12" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
    <text x="-85" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="15" y="-3" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">GET /stacksaga/traces</text>
    <text x="15" y="11" text-anchor="middle" font-size="10" fill="#6b7280">(Bearer User_Token) Direct</text>
  </g>

  <!-- STEP 3: order-service Security Filter to StackSaga Central -->
  <path d="M 695,495 C 740,495 770,410 770,325" fill="none" stroke="#157341" stroke-width="2.5" marker-end="url(#arr-darkgreen-dir)" />
  <g transform="translate(770, 420)">
    <rect x="-105" y="-18" width="210" height="36" rx="10" fill="#ffffff" stroke="#157341" stroke-width="1.5" filter="url(#shadow-direct)" />
    <circle cx="-85" cy="0" r="12" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
    <text x="-85" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="15" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#0a3d24">Verify Dual-Tokens</text>
    <text x="15" y="12" text-anchor="middle" font-size="9" fill="#6b7280">(Service Token + User Token)</text>
  </g>

  <!-- STEP 4: StackSaga Central validates with Central DB -->
  <g transform="translate(965, 235)">
    <circle cx="0" cy="0" r="13" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <rect x="-55" y="15" width="110" height="20" rx="6" fill="#ffffff" stroke="#28b76b" stroke-width="1" />
    <text x="0" y="28" text-anchor="middle" font-size="9" font-weight="600" fill="#0f5132">Validate ACL</text>
  </g>

  <!-- STEP 5: order-service queries Event-Store -->
  <path d="M 720,640 L 1065,640" fill="none" stroke="#28b76b" stroke-width="2.5" marker-end="url(#arr-green-dir)" />
  <g transform="translate(895, 640)">
    <rect x="-100" y="-18" width="200" height="36" rx="10" fill="#ffffff" stroke="#28b76b" stroke-width="1.5" filter="url(#shadow-direct)" />
    <circle cx="-80" cy="0" r="12" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5" />
    <text x="-80" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
    <text x="15" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#0f5132">Query Trace Records</text>
    <text x="15" y="12" text-anchor="middle" font-size="9" fill="#6b7280">Return JSON to TraceWindow</text>
  </g>
</svg>